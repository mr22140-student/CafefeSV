<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:cc="jakarta.faces.composite"
      xmlns:p="http://primefaces.org/ui">

    <cc:interface>
        <cc:attribute name="nuevoAction" method-signature="void action()" required="true" />
        <cc:attribute name="cancelarAction" method-signature="void action()" required="false" />
        <cc:attribute name="actualizar" required="false" default=":frmDetalle" />
    </cc:interface>

    <cc:implementation>
        <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}"
                         icon="pi pi-plus"
                         style="margin-right:10px;"
                         action="#{cc.attrs.nuevoAction}"
                         update="#{cc.attrs.actualizar}" />

        <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}"
                         icon="pi pi-times"
                         action="#{cc.attrs.cancelarAction}"
                         update="#{cc.attrs.actualizar}"
                         rendered="#{not empty cc.attrs.cancelarAction}" />
    </cc:implementation>

</html>
