<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        #{trad['pagina.descuento']}
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmDescuento">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- Tabla de Registros (Solo visible cuando el estado es NINGUNO) -->
            <p:dataTable id="dtDescuento"
                         var="reg"
                         value="#{descuentoModel.registros}"
                         selection="#{descuentoModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idDescuento}"
                         paginator="true" rows="10"
                         emptyMessage="#{trad['comun.sinRegistros']}"
                         rendered="#{descuentoModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{descuentoModel.seleccionarRegistro(descuentoModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmDescuento" />

                <p:column headerText="#{trad['comun.nombre']}">
                    <h:outputText value="#{reg.nombre}" />
                </p:column>
                <p:column headerText="#{trad['descuento.tipo']}">
                    <h:outputText value="#{reg.idTipoDescuento != null ? reg.idTipoDescuento.nombre : trad['comun.sinAsignacion']}" />
                </p:column>
                <p:column headerText="#{trad['descuento.desde']}">
                    <h:outputText value="#{reg.fechaDesde}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{trad['descuento.hasta']}">
                    <h:outputText value="#{reg.fechaHasta}" rendered="#{reg.fechaHasta != null}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                    <h:outputText value="#{trad['comun.sinFin']}" rendered="#{reg.fechaHasta == null}" />
                </p:column>
                <p:column headerText="#{trad['descuento.vigencia']}" style="width: 120px; text-align: center;">
                    <h:outputText value="#{trad['vigencia.'.concat(descuentoModel.vigencia(reg))]}" />
                </p:column>
                <p:column headerText="#{trad['comun.observaciones']}">
                    <h:outputText value="#{reg.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="15" />

            <!-- Botones Principales -->
            <h:panelGroup id="pnlAcciones" layout="block">
                <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}"
                                 icon="pi pi-plus"
                                 style="margin-right:10px;"
                                 action="#{descuentoModel.btnNuevoHandler()}"
                                 rendered="#{descuentoModel.estado == 'NINGUNO'}"
                                 update=":frmDescuento" />

                <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}"
                                 icon="pi pi-times"
                                 action="#{descuentoModel.btnCancelarHandler()}"
                                 rendered="#{descuentoModel.estado != 'NINGUNO'}"
                                 process="@this"
                                 immediate="true"
                                 resetValues="true"
                                 update=":frmDescuento" />
            </h:panelGroup>

            <!-- Formulario de Detalle (Visible únicamente si el estado es CREAR o MODIFICAR) -->
            <p:outputPanel id="pnlFormulario" layout="block" style="margin-top:20px;" rendered="#{descuentoModel.estado != 'NINGUNO'}">
                <p:panel header="#{trad['descuento.detalle']}">
                    <p:panelGrid columns="2"
                                 columnClasses="ui-grid-col-2, ui-grid-col-10"
                                 layout="grid"
                                 styleClass="ui-panelgrid-blank">

                        <p:outputLabel for="cboTipoDescuento" value="#{trad['descuento.tipo']}:" style="font-weight: bold;" />
                        <p:selectOneMenu id="cboTipoDescuento" value="#{descuentoModel.registro.idTipoDescuento}"
                                         converter="entityConverter"
                                         filter="true" filterMatchMode="contains"
                                         disabled="#{descuentoModel.estado == 'MODIFICAR'}"
                                         required="true"
                                         requiredMessage="#{trad['descuento.tipoObligatorio']}"
                                         style="max-width: 350px; width: 100%;">
                            <f:selectItem itemLabel="#{trad['comun.seleccione']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{descuentoModel.listaTipoDescuento}" var="t"
                                           itemLabel="#{t.nombre}"
                                           itemValue="#{t}"
                                           itemDisabled="#{not t.activo and t ne descuentoModel.registro.idTipoDescuento}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="txtNombre" value="#{trad['comun.nombre']}" style="font-weight: bold;" />
                        <p:inputText id="txtNombre" value="#{descuentoModel.registro.nombre}" maxlength="155"
                                     required="true"
                                     requiredMessage="#{trad['comun.nombreObligatorio']}"
                                     style="max-width: 350px; width: 100%;" />


                        <p:outputLabel for="dpFechaDesde" value="#{trad['descuento.fechaDesde']}:" style="font-weight: bold;" />
                        <p:datePicker id="dpFechaDesde" value="#{descuentoModel.registro.fechaDesde}"
                                      showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"
                                      required="true"
                                      requiredMessage="#{trad['descuento.fechaDesdeObligatoria']}" />

                        <p:outputLabel for="dpFechaHasta" value="#{trad['descuento.fechaHasta']}:" style="font-weight: bold;" />
                        <p:datePicker id="dpFechaHasta" value="#{descuentoModel.registro.fechaHasta}"
                                      showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true" />

                        <p:outputLabel for="txtObservaciones" value="#{trad['comun.observaciones']}:" style="font-weight: bold;" />
                        <p:inputTextarea id="txtObservaciones" value="#{descuentoModel.registro.observaciones}" rows="3"
                                         style="max-width: 350px; width: 100%;" />

                    </p:panelGrid>

                    <p:spacer height="15" />

                    <!-- Botones del Formulario -->
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <p:commandButton value="#{tradcrud['jsf.crud.crear']}"
                                         icon="pi pi-save"
                                         action="#{descuentoModel.btnCrearHandler()}"
                                         rendered="#{descuentoModel.estado == 'CREAR'}"
                                         update=":frmDescuento" />

                        <p:commandButton value="#{tradcrud['jsf.crud.modificar']}"
                                         icon="pi pi-save"
                                         action="#{descuentoModel.btnModificarHandler()}"
                                         rendered="#{descuentoModel.estado == 'MODIFICAR'}"
                                         update=":frmDescuento" />

                        <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}"
                                         icon="pi pi-trash"
                                         styleClass="ui-button-danger"
                                         action="#{descuentoModel.btnEliminarHandler()}"
                                         rendered="#{descuentoModel.estado == 'MODIFICAR'}"
                                         process="@this"
                                         immediate="true"
                                         update=":frmDescuento">
                            <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                       message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </div>
                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
