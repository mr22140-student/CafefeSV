<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Roles por empleado
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmEmpleadoRol">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <p:dataTable id="dtEmpleadoRol" var="reg"
                         value="#{empleadoRolModel.registros}"
                         selection="#{empleadoRolModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idEmpleadoRol}"
                         paginator="true" rows="10"
                         emptyMessage="No hay registros"
                         rendered="#{empleadoRolModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{empleadoRolModel.seleccionarRegistro(empleadoRolModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmEmpleadoRol" />

                <p:column headerText="ID" style="width: 280px; text-align: center;">
                    <h:outputText value="#{reg.idEmpleadoRol}" />
                </p:column>

                <p:column headerText="Empleado">
                    <h:outputText value="#{empleadoRolModel.nombreEmpleado(reg.idEmpleado)}" />
                </p:column>

                <p:column headerText="Rol">
                    <h:outputText value="#{reg.idRol != null ? reg.idRol.nombre : 'Sin asignación'}" />
                </p:column>

                <p:column headerText="Estado" style="width: 110px; text-align: center;">
                    <h:outputText value="#{reg.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>

                <p:column headerText="Observaciones">
                    <h:outputText value="#{reg.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             action="#{empleadoRolModel.btnNuevoHandler()}"
                             rendered="#{empleadoRolModel.estado == 'NINGUNO'}"
                             update=":frmEmpleadoRol" />

            <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;"
                           rendered="#{empleadoRolModel.estado != 'NINGUNO'}">
                <p:panel header="Mantenimiento Rol por Empleado">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="ID" for="txtId" />
                        <p:inputText id="txtId" value="#{empleadoRolModel.registro.idEmpleadoRol}"
                                     readonly="true" size="40" />

                        <p:outputLabel value="Empleado" for="cboEmpleado" />
                        <p:selectOneMenu id="cboEmpleado" value="#{empleadoRolModel.registro.idEmpleado}"
                                         filter="true" filterMatchMode="contains"
                                         required="true" requiredMessage="El empleado es obligatorio."
                                         style="width: 350px;">
                            <f:selectItem itemLabel="Seleccione..." itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{empleadoRolModel.listaEmpleado}" var="x"
                                           itemLabel="#{empleadoRolModel.nombreCompleto(x)}"
                                           itemValue="#{x.idEmpleado}" />
                        </p:selectOneMenu>

                        <p:outputLabel value="Rol" for="cboRol" />
                        <p:selectOneMenu id="cboRol" value="#{empleadoRolModel.registro.idRol}"
                                         converter="entityConverter"
                                         filter="true" filterMatchMode="contains"
                                         required="true" requiredMessage="El rol es obligatorio."
                                         style="width: 350px;">
                            <f:selectItem itemLabel="Seleccione..." itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{empleadoRolModel.listaRol}" var="x"
                                           itemLabel="#{x.nombre}" itemValue="#{x}" />
                        </p:selectOneMenu>

                        <p:outputLabel value="Activo" for="chkActivo" />
                        <p:selectBooleanCheckbox id="chkActivo" value="#{empleadoRolModel.registro.activo}" />

                        <p:outputLabel value="Observaciones" for="txtObs" />
                        <p:inputTextarea id="txtObs" value="#{empleadoRolModel.registro.observaciones}"
                                         rows="3" cols="40" />
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <p:commandButton value="#{tradcrud['jsf.crud.crear']}" icon="pi pi-save"
                                     action="#{empleadoRolModel.btnCrearHandler()}"
                                     rendered="#{empleadoRolModel.estado == 'CREAR'}"
                                     update=":frmEmpleadoRol"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" icon="pi pi-save"
                                     action="#{empleadoRolModel.btnModificarHandler()}"
                                     rendered="#{empleadoRolModel.estado == 'MODIFICAR'}"
                                     update=":frmEmpleadoRol"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" icon="pi pi-trash"
                                     action="#{empleadoRolModel.btnEliminarHandler()}"
                                     rendered="#{empleadoRolModel.estado == 'MODIFICAR'}"
                                     process="@this"
                                     immediate="true"
                                     update=":frmEmpleadoRol"
                                     style="margin-right:10px;">
                        <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                   message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                   icon="pi pi-exclamation-triangle" />
                    </p:commandButton>

                    <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                     action="#{empleadoRolModel.btnCancelarHandler()}"
                                     process="@this"
                                     immediate="true"
                                     resetValues="true"
                                     update=":frmEmpleadoRol" />
                </p:panel>
            </p:outputPanel>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
