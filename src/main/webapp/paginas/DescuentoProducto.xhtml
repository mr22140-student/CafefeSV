<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Descuentos por Producto
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmDescuentoProducto">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- Tabla de Registros -->
            <p:dataTable id="dtDescuentoProducto"
                         var="reg"
                         value="#{descuentoProductoModel.registros}"
                         selection="#{descuentoProductoModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idDescuentoProducto}"
                         paginator="true" rows="10"
                         emptyMessage="#{trad['comun.sinRegistros']}"
                         rendered="#{descuentoProductoModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{descuentoProductoModel.seleccionarRegistro(descuentoProductoModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmDescuentoProducto" />

                <p:column headerText="#{trad['comun.producto']}">
                    <h:outputText value="#{reg.idProducto != null ? reg.idProducto.nombre : trad['comun.sinAsignacion']}" />
                </p:column>
                <p:column headerText="Descuento">
                    <h:outputText value="#{reg.idDescuento != null ? reg.idDescuento.nombre : trad['comun.sinAsignacion']}" />
                </p:column>
                <p:column headerText="Valor" style="width: 100px; text-align: center;">
                    <h:outputText value="#{reg.valor != null ? reg.valor += ' %' : ''}" />
                </p:column>
                <p:column headerText="Desde">
                    <h:outputText value="#{reg.fechaDesde}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>
                <p:column headerText="Hasta">
                    <h:outputText value="#{reg.fechaHasta}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{trad['comun.observaciones']}">
                    <h:outputText value="#{reg.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="15" />

            <!-- Botones Principales -->
            <h:panelGroup id="pnlAcciones" layout="block">
                <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}"
                                 icon="pi pi-plus"
                                 style="margin-right:10px;"
                                 action="#{descuentoProductoModel.btnNuevoHandler()}"
                                 rendered="#{descuentoProductoModel.estado == 'NINGUNO'}"
                                 update=":frmDescuentoProducto" />

                <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}"
                                 icon="pi pi-times"
                                 action="#{descuentoProductoModel.btnCancelarHandler()}"
                                 rendered="#{descuentoProductoModel.estado != 'NINGUNO'}"
                                 process="@this"
                                 immediate="true"
                                 resetValues="true"
                                 update=":frmDescuentoProducto" />
            </h:panelGroup>

            <!-- Formulario de Detalle -->
            <p:outputPanel id="pnlFormulario" layout="block" style="margin-top:20px;" rendered="#{descuentoProductoModel.estado != 'NINGUNO'}">
                <p:panel header="Detalle del Descuento del Producto">
                    <p:panelGrid columns="2"
                                 columnClasses="ui-grid-col-2, ui-grid-col-10"
                                 layout="grid"
                                 styleClass="ui-panelgrid-blank">

                        <p:outputLabel for="cboProducto" value="Producto:" style="font-weight: bold;" />
                        <p:selectOneMenu id="cboProducto" value="#{descuentoProductoModel.registro.idProducto}"
                                         converter="entityConverter"
                                         filter="true" filterMatchMode="contains"
                                         required="true"
                                         requiredMessage="#{trad['ordenProducto.productoObligatorio']}"
                                         style="max-width: 350px; width: 100%;">
                            <f:selectItem itemLabel="#{trad['comun.seleccione']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{descuentoProductoModel.listaProducto}" var="p"
                                           itemLabel="#{p.nombre}"
                                           itemValue="#{p}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="cboDescuento" value="Descuento:" style="font-weight: bold;" />
                        <p:selectOneMenu id="cboDescuento" value="#{descuentoProductoModel.registro.idDescuento}"
                                         converter="entityConverter"
                                         filter="true" filterMatchMode="contains"
                                         required="true"
                                         requiredMessage="El descuento es obligatorio."
                                         style="max-width: 350px; width: 100%;">
                            <f:selectItem itemLabel="#{trad['comun.seleccione']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{descuentoProductoModel.listaDescuento}" var="d"
                                           itemLabel="#{d.nombre}"
                                           itemValue="#{d}" />
                            <p:ajax event="change"
                                    listener="#{descuentoProductoModel.onDescuentoChange()}"
                                    process="@this"
                                    update="dpFechaDesde dpFechaHasta lblMaximo messages" />
                        </p:selectOneMenu>

                        <p:outputLabel for="txtValor" value="Valor:" style="font-weight: bold;" />
                        <h:panelGroup>
                            <p:inputNumber id="txtValor"
                                           value="#{descuentoProductoModel.registro.valor}"
                                           symbol=" %" symbolPosition="s"
                                           decimalPlaces="0"
                                           minValue="0" maxValue="100"
                                           required="true"
                                           requiredMessage="El valor es obligatorio."
                                           inputStyle="max-width: 150px;" />
                            <h:outputText id="lblMaximo"
                                          value="#{descuentoProductoModel.descuentoMaximo != null ? 'Máximo permitido: ' += descuentoProductoModel.descuentoMaximo += ' %' : ''}"
                                          style="margin-left: 10px; font-style: italic;" />
                        </h:panelGroup>

                        <p:outputLabel for="dpFechaDesde" value="Fecha desde:" style="font-weight: bold;" />
                        <p:datePicker id="dpFechaDesde" value="#{descuentoProductoModel.registro.fechaDesde}"
                                      showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true" />

                        <p:outputLabel for="dpFechaHasta" value="Fecha hasta:" style="font-weight: bold;" />
                        <p:datePicker id="dpFechaHasta" value="#{descuentoProductoModel.registro.fechaHasta}"
                                      showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true" />

                        <p:outputLabel for="txtObservaciones" value="#{trad['comun.observaciones']}:" style="font-weight: bold;" />
                        <p:inputTextarea id="txtObservaciones" value="#{descuentoProductoModel.registro.observaciones}" rows="3"
                                         style="max-width: 350px; width: 100%;" />

                    </p:panelGrid>

                    <p:spacer height="15" />

                    <!-- Botones del Formulario -->
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <p:commandButton value="#{tradcrud['jsf.crud.crear']}"
                                         icon="pi pi-save"
                                         action="#{descuentoProductoModel.btnCrearHandler()}"
                                         rendered="#{descuentoProductoModel.estado == 'CREAR'}"
                                         update=":frmDescuentoProducto" />

                        <p:commandButton value="#{tradcrud['jsf.crud.modificar']}"
                                         icon="pi pi-save"
                                         action="#{descuentoProductoModel.btnModificarHandler()}"
                                         rendered="#{descuentoProductoModel.estado == 'MODIFICAR'}"
                                         update=":frmDescuentoProducto" />

                        <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}"
                                         icon="pi pi-trash"
                                         styleClass="ui-button-danger"
                                         action="#{descuentoProductoModel.btnEliminarHandler()}"
                                         rendered="#{descuentoProductoModel.estado == 'MODIFICAR'}"
                                         process="@this"
                                         immediate="true"
                                         update=":frmDescuentoProducto">
                            <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                       message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </div>
                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
