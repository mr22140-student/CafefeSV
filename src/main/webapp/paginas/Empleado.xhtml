<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
       #{trad['pagina.empleado']}
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmEmpleado">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- ================= Tabla de empleados ================= -->
            <p:dataTable id="dtEmpleado" var="reg"
                         value="#{empleadoModel.registros}"
                         selection="#{empleadoModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idEmpleado}"
                         paginator="true" rows="10"
                         emptyMessage="#{trad['comun.sinRegistros']}"
                         rendered="#{empleadoModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{empleadoModel.seleccionarRegistro(empleadoModel.filaSeleccionada)}"
                        resetValues="true"
                        update="@form" />

                <p:column headerText="#{trad['comun.nombre']}">
                    <h:outputText value="#{reg.nombre}" />
                </p:column>

                <p:column headerText="#{trad['empleado.apellido']}">
                    <h:outputText value="#{reg.apellido}" />
                </p:column>

                <p:column headerText="#{trad['comun.estado']}" style="width: 110px; text-align: center;">
                    <h:outputText value="#{reg.activo ? trad['comun.estado.activo'] : trad['comun.estado.inactivo']}" />
                </p:column>

                <p:column headerText="#{trad['comun.comentarios']}">
                    <h:outputText value="#{empty reg.comentarios ? '—' : reg.comentarios}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             action="#{empleadoModel.btnNuevoHandler()}"
                             rendered="#{empleadoModel.estado == 'NINGUNO'}"
                             update="@form" />

            <!-- ================= Panel de edición con pestañas ================= -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;"
                           rendered="#{empleadoModel.estado != 'NINGUNO'}">

                <p:tabView id="tabsEmpleado">

                    <!-- ============ Pestaña 1: datos del empleado ============ -->
                    <p:tab title="#{trad['empleado.tab.datos']}">
                        <p:panelGrid columns="2">
                            <p:outputLabel value="ID" for="txtId" />
                            <p:inputText id="txtId" value="#{empleadoModel.registro.idEmpleado}"
                                         readonly="true" size="40" />

                            <p:outputLabel value="#{trad['comun.nombre']}" for="txtNombre" />
                            <p:inputText id="txtNombre" value="#{empleadoModel.registro.nombre}"
                                         maxlength="255" size="40"
                                         required="true" requiredMessage="#{trad['comun.nombreObligatorio']}" />

                            <p:outputLabel value="#{trad['empleado.apellido']}" for="txtApellido" />
                            <p:inputText id="txtApellido" value="#{empleadoModel.registro.apellido}"
                                         maxlength="255" size="40"
                                         required="true" requiredMessage="#{trad['empleado.apellidoObligatorio']}" />

                            <p:outputLabel value="#{trad['comun.activo']}" for="chkActivo" />
                            <p:selectBooleanCheckbox id="chkActivo" value="#{empleadoModel.registro.activo}" />

                            <p:outputLabel value="#{trad['comun.comentarios']}" for="txtComentarios" />
                            <p:inputTextarea id="txtComentarios" value="#{empleadoModel.registro.comentarios}"
                                             rows="3" cols="40" />
                        </p:panelGrid>

                        <!-- Botones del empleado -->
                        <div style="margin-top: 10px;">
                            <p:commandButton value="#{tradcrud['jsf.crud.crear']}" icon="pi pi-save"
                                             action="#{empleadoModel.btnCrearHandler()}"
                                             rendered="#{empleadoModel.estado == 'CREAR'}"
                                             update="@form"
                                             style="margin-right:10px;" />

                            <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" icon="pi pi-save"
                                             action="#{empleadoModel.btnModificarHandler()}"
                                             rendered="#{empleadoModel.estado == 'MODIFICAR'}"
                                             update="@form"
                                             style="margin-right:10px;" />

                            <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" icon="pi pi-trash"
                                             action="#{empleadoModel.btnEliminarHandler()}"
                                             rendered="#{empleadoModel.estado == 'MODIFICAR'}"
                                             process="@this"
                                             immediate="true"
                                             update="@form"
                                             style="margin-right:10px;">
                                <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                           message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>

                            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                             action="#{empleadoModel.btnCancelarHandler()}"
                                             process="@this"
                                             immediate="true"
                                             resetValues="true"
                                             update="@form" />
                        </div>
                    </p:tab>

                    <!-- ============ Pestaña 2: EmpleadoRol (solo al seleccionar un empleado) ============ -->
                    <p:tab title="#{trad['empleado.tab.rol']}" rendered="#{empleadoModel.estado == 'MODIFICAR'}">

                        <p:panelGrid columns="2">
                            <p:outputLabel value="#{trad['comun.rol']}" for="cboRol" />
                            <p:selectOneMenu id="cboRol" value="#{empleadoModel.rolSeleccionado}"
                                             converter="entityConverter"
                                             style="width: 250px;">
                                <f:selectItem itemLabel="#{trad['comun.seleccione']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{empleadoModel.listaRol}" var="x"
                                               itemLabel="#{x.nombre}" itemValue="#{x}" />
                            </p:selectOneMenu>
                        </p:panelGrid>

                        <!-- Rol actual del empleado (solo lectura) -->
                        <p:dataTable id="dtRolesEmpleado" var="er"
                                     value="#{empleadoModel.rolesEmpleado}"
                                     emptyMessage="#{trad['empleado.sinRol']}"
                                     style="margin-top: 10px;">
                            <p:column headerText="#{trad['empleado.rolActual']}">
                                <h:outputText value="#{er.idRol != null ? er.idRol.nombre : trad['comun.sinAsignacion']}" />
                            </p:column>
                            <p:column headerText="#{trad['comun.estado']}" style="width: 110px; text-align: center;">
                                <h:outputText value="#{er.activo ? trad['comun.estado.activo'] : trad['comun.estado.inactivo']}" />
                            </p:column>
                        </p:dataTable>

                        <!-- Botones de la pestaña EmpleadoRol -->
                        <div style="margin-top: 10px;">
                            <!-- Si NO tiene rol: Asignar -->
                            <p:commandButton value="#{trad['empleado.asignar']}" icon="pi pi-plus"
                                             action="#{empleadoModel.btnAgregarRolHandler()}"
                                             rendered="#{empty empleadoModel.rolesEmpleado}"
                                             process="@this cboRol"
                                             update="@form"
                                             style="margin-right:10px;" />

                            <!-- Si YA tiene rol: Modificar -->
                            <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" icon="pi pi-save"
                                             action="#{empleadoModel.btnModificarRolHandler()}"
                                             rendered="#{not empty empleadoModel.rolesEmpleado}"
                                             process="@this cboRol"
                                             update="@form"
                                             style="margin-right:10px;" />

                            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                             action="#{empleadoModel.btnCancelarHandler()}"
                                             process="@this"
                                             immediate="true"
                                             resetValues="true"
                                             update="@form" />
                        </div>
                    </p:tab>

                </p:tabView>
            </p:outputPanel>

            <!-- Diálogo de confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
