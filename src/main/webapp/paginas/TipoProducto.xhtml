<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Tipo Producto
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmTipoProducto">
            <p:messages id="mensajes" showDetail="true" showSummary="true" closable="true" />

            <!-- Tabla de Registros -->
            <p:dataTable id="tblRegistros" value="#{tipoProductoModel.registros}" var="tp"
                         selectionMode="single"
                         selection="#{tipoProductoModel.filaSeleccionada}"
                         rowKey="#{tp.idTipoProducto}">

                <p:ajax event="rowSelect"
                        listener="#{tipoProductoModel.seleccionarRegistro(tipoProductoModel.filaSeleccionada)}"
                        update=":frmTipoProducto" />

                <p:column headerText="ID">
                    <h:outputText value="#{tp.idTipoProducto}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{tp.nombre}" />
                </p:column>

                <p:column headerText="Estado">
                    <h:outputText value="#{tp.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>

                <p:column headerText="Observaciones">
                    <h:outputText value="#{tp.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <!-- Botones globales -->
            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             style="margin-right:10px;"
                             action="#{tipoProductoModel.btnNuevoHandler()}"
                             update=":frmTipoProducto" />
                             
            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                             action="#{tipoProductoModel.btnCancelarHandler()}"
                             process="@this"
                             immediate="true"
                             update=":frmTipoProducto" />

            <p:spacer height="10" />

            <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;" 
                           rendered="#{tipoProductoModel.estado != 'NINGUNO'}">
                <p:panel header="Mantenimiento Tipo Producto">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="ID" for="txtId"/>
                        <p:inputText id="txtId" value="#{tipoProductoModel.registro.idTipoProducto}" readonly="true" />

                        <p:outputLabel value="Nombre" for="txtNombre"/>
                        <p:inputText id="txtNombre" value="#{tipoProductoModel.registro.nombre}" maxlength="155"
                                     required="true" requiredMessage="El nombre es obligatorio." />

                        <p:outputLabel value="Activo" for="chkActivo"/>
                        <p:selectBooleanCheckbox id="chkActivo" value="#{tipoProductoModel.registro.activo}"/>

                        <p:outputLabel value="Observaciones" for="txtObs"/>
                        <p:inputTextarea id="txtObs" value="#{tipoProductoModel.registro.observaciones}" rows="3" cols="40"/>
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <!-- Botones de Acción -->
                    <p:commandButton value="#{tradcrud['jsf.crud.crear']}" 
                                     icon="pi pi-save"
                                     action="#{tipoProductoModel.btnCrearHandler()}"
                                     rendered="#{tipoProductoModel.estado == 'CREAR'}"
                                     update=":frmTipoProducto" />

                    <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" 
                                     icon="pi pi-save"
                                     action="#{tipoProductoModel.btnModificarHandler()}"
                                     rendered="#{tipoProductoModel.estado == 'MODIFICAR'}"
                                     update=":frmTipoProducto"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" 
                                     icon="pi pi-trash"
                                     action="#{tipoProductoModel.btnEliminarHandler()}"
                                     rendered="#{tipoProductoModel.estado == 'MODIFICAR'}"
                                     process="@this"
                                     immediate="true"
                                     update=":frmTipoProducto">
                        <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}" 
                                   message="#{tradcrud['jsf.crud.confirmacion.mensaje']}" 
                                   icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>
