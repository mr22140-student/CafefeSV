<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Tipos por Producto
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmProductoTipoProducto">
            <p:messages id="messages" showDetail="true" showSummary="true" closable="true" />

            <!-- Tabla de Registros (Solo visible cuando el estado es NINGUNO) -->
            <p:dataTable id="dtProductoTipoProducto"
                         var="reg"
                         value="#{productoTipoProductoModel.registros}"
                         selection="#{productoTipoProductoModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idProductoTipoProducto}"
                         paginator="true" rows="10"
                         emptyMessage="No hay registros"
                         rendered="#{productoTipoProductoModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{productoTipoProductoModel.seleccionarRegistro(productoTipoProductoModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmProductoTipoProducto" />

                <p:column headerText="Producto">
                    <h:outputText value="#{reg.producto != null ? reg.producto.nombre : 'Sin asignación'}" />
                </p:column>
                <p:column headerText="Tipo de producto">
                    <h:outputText value="#{reg.idTipoProducto != null ? reg.idTipoProducto.nombre : 'Sin asignación'}" />
                </p:column>
                <p:column headerText="Fecha de creación">
                    <h:outputText value="#{reg.fechaCreacion}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>
                <p:column headerText="Observaciones">
                    <h:outputText value="#{reg.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="15" />

            <!-- Botones Principales -->
            <h:panelGroup id="pnlAcciones" layout="block">
                <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}"
                                 icon="pi pi-plus"
                                 style="margin-right:10px;"
                                 action="#{productoTipoProductoModel.btnNuevoHandler()}"
                                 rendered="#{productoTipoProductoModel.estado == 'NINGUNO'}"
                                 update=":frmProductoTipoProducto" />

                <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}"
                                 icon="pi pi-times"
                                 action="#{productoTipoProductoModel.btnCancelarHandler()}"
                                 rendered="#{productoTipoProductoModel.estado != 'NINGUNO'}"
                                 process="@this"
                                 immediate="true"
                                 resetValues="true"
                                 update=":frmProductoTipoProducto" />
            </h:panelGroup>

            <!-- Formulario de Detalle (Visible únicamente si el estado es CREAR o MODIFICAR) -->
            <p:outputPanel id="pnlFormulario" layout="block" style="margin-top:20px;" rendered="#{productoTipoProductoModel.estado != 'NINGUNO'}">
                <p:panel header="Detalle de la Asignación">
                    <p:panelGrid columns="2"
                                 columnClasses="ui-grid-col-2, ui-grid-col-10"
                                 layout="grid"
                                 styleClass="ui-panelgrid-blank">

                        <p:outputLabel for="cboProducto" value="Producto:" style="font-weight: bold;" />
                        <p:selectOneMenu id="cboProducto" value="#{productoTipoProductoModel.registro.producto}"
                                         converter="entityConverter"
                                         filter="true" filterMatchMode="contains"
                                         required="true"
                                         requiredMessage="Producto es obligatorio."
                                         style="max-width: 350px; width: 100%;">
                            <f:selectItem itemLabel="Seleccione..." itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{productoTipoProductoModel.listaProducto}" var="p"
                                           itemLabel="#{p.nombre}"
                                           itemValue="#{p}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="cboTipoProducto" value="Tipo de producto:" style="font-weight: bold;" />
                        <p:selectOneMenu id="cboTipoProducto" value="#{productoTipoProductoModel.registro.idTipoProducto}"
                                         converter="entityConverter"
                                         filter="true" filterMatchMode="contains"
                                         required="true"
                                         requiredMessage="Tipo de producto es obligatorio."
                                         style="max-width: 350px; width: 100%;">
                            <f:selectItem itemLabel="Seleccione..." itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{productoTipoProductoModel.listaTipoProducto}" var="t"
                                           itemLabel="#{t.nombre}"
                                           itemValue="#{t}" />
                        </p:selectOneMenu>

                        <p:outputLabel value="Fecha de creación:" style="font-weight: bold;" />
                        <h:outputText id="lblFechaCreacion" value="#{productoTipoProductoModel.registro.fechaCreacion}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                        </h:outputText>

                        <p:outputLabel for="txtObservaciones" value="Observaciones:" style="font-weight: bold;" />
                        <p:inputTextarea id="txtObservaciones" value="#{productoTipoProductoModel.registro.observaciones}" rows="3"
                                         style="max-width: 350px; width: 100%;" />

                    </p:panelGrid>

                    <p:spacer height="15" />

                    <!-- Botones del Formulario -->
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <p:commandButton value="#{tradcrud['jsf.crud.crear']}"
                                         icon="pi pi-save"
                                         action="#{productoTipoProductoModel.btnCrearHandler()}"
                                         rendered="#{productoTipoProductoModel.estado == 'CREAR'}"
                                         update=":frmProductoTipoProducto" />

                        <p:commandButton value="#{tradcrud['jsf.crud.modificar']}"
                                         icon="pi pi-save"
                                         action="#{productoTipoProductoModel.btnModificarHandler()}"
                                         rendered="#{productoTipoProductoModel.estado == 'MODIFICAR'}"
                                         update=":frmProductoTipoProducto" />

                        <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}"
                                         icon="pi pi-trash"
                                         styleClass="ui-button-danger"
                                         action="#{productoTipoProductoModel.btnEliminarHandler()}"
                                         rendered="#{productoTipoProductoModel.estado == 'MODIFICAR'}"
                                         process="@this"
                                         immediate="true"
                                         update=":frmProductoTipoProducto">
                            <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                       message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </div>
                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
