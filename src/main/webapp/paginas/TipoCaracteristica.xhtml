<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Tipos de Característica
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmTipoCaracteristica">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- Tabla de Registros (Solo visible en estado NINGUNO) -->
            <p:dataTable id="dtTipoCaracteristica"
                         var="reg"
                         value="#{tipoCaracteristicaModel.registros}"
                         selection="#{tipoCaracteristicaModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idTipoCaracteristica}"
                         paginator="true" rows="10"
                         emptyMessage="No hay registros"
                         rendered="#{tipoCaracteristicaModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{tipoCaracteristicaModel.seleccionarRegistro(tipoCaracteristicaModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmTipoCaracteristica" />

                <p:column headerText="Nombre">
                    <h:outputText value="#{reg.nombre}" />
                </p:column>
                <p:column headerText="Observaciones">
                    <h:outputText value="#{reg.observaciones}" />
                </p:column>
                <p:column headerText="Estado" style="width: 120px; text-align: center;">
                    <h:outputText value="#{reg.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <!-- Botones Principales -->
            <h:panelGroup id="pnlAcciones" layout="block">
                <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" 
                                 icon="pi pi-plus" 
                                 style="margin-right:10px;"
                                 action="#{tipoCaracteristicaModel.btnNuevoHandler()}"
                                 rendered="#{tipoCaracteristicaModel.estado == 'NINGUNO'}"
                                 update=":frmTipoCaracteristica" />

                <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" 
                                 icon="pi pi-times" 
                                 action="#{tipoCaracteristicaModel.btnCancelarHandler()}" 
                                 rendered="#{tipoCaracteristicaModel.estado != 'NINGUNO'}"
                                 process="@this"
                                 immediate="true"
                                 resetValues="true"
                                 update=":frmTipoCaracteristica" />
            </h:panelGroup>

            <p:spacer height="10" />

            <!-- Formulario Compacto Centrado -->
            <p:outputPanel id="pnlFormulario" layout="block" style="margin-top:20px;" rendered="#{tipoCaracteristicaModel.estado != 'NINGUNO'}">
                <p:panel header="Detalle del Tipo de Característica">
                    <div style="max-width: 600px;">
                        <p:panelGrid columns="2" 
                                     layout="grid" 
                                     columnClasses="ui-grid-col-3, ui-grid-col-9" 
                                     styleClass="ui-panelgrid-blank ui-fluid">

                            <p:outputLabel for="txtNombre" value="Nombre:" />
                            <p:inputText id="txtNombre" 
                                         value="#{tipoCaracteristicaModel.registro.nombre}" 
                                         required="true" 
                                         requiredMessage="El nombre es obligatorio." />

                            <p:outputLabel for="chkActivo" value="Activo:" />
                            <p:selectBooleanCheckbox id="chkActivo" value="#{tipoCaracteristicaModel.registro.activo}" />

                            <p:outputLabel for="txtObservaciones" value="Observaciones:" />
                            <p:inputTextarea id="txtObservaciones" 
                                             value="#{tipoCaracteristicaModel.registro.observaciones}" 
                                             rows="3" />

                        </p:panelGrid>

                        <p:spacer height="15" />

                        <!-- Botones del Formulario -->
                        <div style="display: flex; gap: 10px;">
                            <p:commandButton value="#{tradcrud['jsf.crud.crear']}" 
                                             icon="pi pi-save" 
                                             action="#{tipoCaracteristicaModel.btnCrearHandler()}" 
                                             rendered="#{tipoCaracteristicaModel.estado == 'CREAR'}" 
                                             update=":frmTipoCaracteristica" />

                            <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" 
                                             icon="pi pi-save" 
                                             action="#{tipoCaracteristicaModel.btnModificarHandler()}" 
                                             rendered="#{tipoCaracteristicaModel.estado == 'MODIFICAR'}" 
                                             update=":frmTipoCaracteristica" />

                            <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" 
                                             icon="pi pi-trash" 
                                             styleClass="ui-button-danger"
                                             action="#{tipoCaracteristicaModel.btnEliminarHandler()}" 
                                             rendered="#{tipoCaracteristicaModel.estado == 'MODIFICAR'}" 
                                             process="@this"
                                             immediate="true"
                                             update=":frmTipoCaracteristica">
                                <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}" 
                                           message="#{tradcrud['jsf.crud.confirmacion.mensaje']}" 
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>
                        </div>
                    </div>
                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
