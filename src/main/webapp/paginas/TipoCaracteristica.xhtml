<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Tipo Característica
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmTipoCaracteristica">
            <p:messages id="mensajes" showDetail="true" showSummary="true" closable="true" />

            <!-- Tabla de Registros -->
            <p:dataTable id="tblRegistros" value="#{tipoCaracteristicaModel.registros}" var="r"
                         selectionMode="single"
                         selection="#{tipoCaracteristicaModel.filaSeleccionada}"
                         rowKey="#{r.idTipoCaracteristica}">

                <p:ajax event="rowSelect"
                        listener="#{tipoCaracteristicaModel.seleccionarRegistro(tipoCaracteristicaModel.filaSeleccionada)}"
                        update=":frmTipoCaracteristica" />

                <p:column headerText="ID">
                    <h:outputText value="#{r.idTipoCaracteristica}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{r.nombre}" />
                </p:column>

                <p:column headerText="Expresión Regular">
                    <h:outputText value="#{r.expresionRegular}" />
                </p:column>

                <p:column headerText="Estado">
                    <h:outputText value="#{r.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>

                <p:column headerText="Observaciones">
                    <h:outputText value="#{r.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <!-- Botones globales -->
            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             style="margin-right:10px;"
                             action="#{tipoCaracteristicaModel.btnNuevoHandler()}"
                             update=":frmTipoCaracteristica" />
            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                             action="#{tipoCaracteristicaModel.btnCancelarHandler()}"
                             process="@this"
                             immediate="true"
                             update=":frmTipoCaracteristica" />

            <p:spacer height="10" />

           <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;" rendered="#{tipoCaracteristicaModel.estado != 'NINGUNO'}">
                <p:panel header="Mantenimiento Tipo Característica">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="ID" for="txtId"/>
                        <p:inputText id="txtId" value="#{tipoCaracteristicaModel.registro.idTipoCaracteristica}" readonly="true" />

                        <p:outputLabel value="Nombre" for="txtNombre"/>
                        <p:inputText id="txtNombre" value="#{tipoCaracteristicaModel.registro.nombre}" maxlength="155"
                                     required="true" requiredMessage="El nombre es obligatorio." />

                        <p:outputLabel value="Expresión Regular" for="txtExpReg"/>
                        <p:inputText id="txtExpReg" value="#{tipoCaracteristicaModel.registro.expresionRegular}" />

                        <p:outputLabel value="Activo" for="chkActivo"/>
                        <p:selectBooleanCheckbox id="chkActivo" value="#{tipoCaracteristicaModel.registro.activo}"/>

                        <p:outputLabel value="Observaciones" for="txtObs"/>
                        <p:inputTextarea id="txtObs" value="#{tipoCaracteristicaModel.registro.observaciones}" rows="3" cols="40"/>
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <!-- Botones traducidos -->
                    <p:commandButton value="#{tradcrud['jsf.crud.crear']}" 
                                     icon="pi pi-save"
                                     action="#{tipoCaracteristicaModel.btnCrearHandler()}"
                                     rendered="#{tipoCaracteristicaModel.estado == 'CREAR'}"
                                     update=":frmTipoCaracteristica" />

                    <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" 
                                     icon="pi pi-save"
                                     action="#{tipoCaracteristicaModel.btnModificarHandler()}"
                                     rendered="#{tipoCaracteristicaModel.estado == 'MODIFICAR'}"
                                     update=":frmTipoCaracteristica"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" 
                                     icon="pi pi-trash"
                                     action="#{tipoCaracteristicaModel.btnEliminarHandler()}"
                                     rendered="#{tipoCaracteristicaModel.estado == 'MODIFICAR'}"
                                     process="@this"
                                     immediate="true"
                                     update=":frmTipoCaracteristica">
                        <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}" 
                                   message="#{tradcrud['jsf.crud.confirmacion.mensaje']}" 
                                   icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación traducido -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>
