<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        #{trad['pagina.orden']}
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmOrden">
            <p:growl id="messages" life="6000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- ================= Tabla de órdenes ================= -->
            <p:dataTable id="dtOrden" var="reg"
                         value="#{ordenModel.registros}"
                         selection="#{ordenModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idOrden}"
                         paginator="true" rows="10"
                         emptyMessage="#{trad['comun.sinRegistros']}"
                         rendered="#{ordenModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{ordenModel.seleccionarRegistro(ordenModel.filaSeleccionada)}"
                        resetValues="true"
                        update="@form" />

                <p:column headerText="#{trad['comun.fecha']}" style="width: 170px;">
                    <h:outputText value="#{reg.fechaCreacion}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>

                <p:column headerText="#{trad['orden.tomadaPor']}">
                    <h:outputText value="#{reg.idEmpleadoRol != null ? ordenModel.obtenerTextoEmpleadoRol(reg.idEmpleadoRol) : trad['comun.sinAsignacion']}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             action="#{ordenModel.btnNuevoHandler()}"
                             rendered="#{ordenModel.estado == 'NINGUNO'}"
                             update="@form" />

            <!-- ================= Panel de edición con pestañas ================= -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;"
                           rendered="#{ordenModel.estado != 'NINGUNO'}">

                <p:tabView id="tabsOrden">

                    <!-- ============ Pestaña 1: datos de la orden ============ -->
                    <p:tab title="#{trad['orden.tab.datos']}">
                        <p:panelGrid columns="2">
                            <p:outputLabel value="#{trad['comun.fecha']}" for="dpFecha" />
                            <p:datePicker id="dpFecha" value="#{ordenModel.registro.fechaCreacion}"
                                          showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"
                                          required="true" requiredMessage="#{trad['orden.fechaObligatoria']}" />

                            <p:outputLabel value="#{trad['orden.camarero']}" for="acEmpleadoRol" />
                            <p:autoComplete id="acEmpleadoRol"
                                            value="#{ordenModel.registro.idEmpleadoRol}"
                                            completeMethod="#{ordenModel.completarEmpleadoRol}"
                                            var="er"
                                            itemLabel="#{ordenModel.obtenerTextoEmpleadoRol(er)}"
                                            itemValue="#{er}"
                                            converter="#{ordenModel.empleadoRolConverter}"
                                            forceSelection="true"
                                            dropdown="true"
                                            queryDelay="300"
                                            scrollHeight="250"
                                            size="40"
                                            placeholder="#{trad['orden.buscarCamarero']}"
                                            emptyMessage="#{trad['orden.sinCamareros']}"
                                            required="true"
                                            requiredMessage="#{trad['orden.camareroObligatorio']}" />
                        </p:panelGrid>

                        <div style="margin-top: 10px;">
                            <p:commandButton value="#{tradcrud['jsf.crud.crear']}" icon="pi pi-save"
                                             action="#{ordenModel.btnCrearHandler()}"
                                             rendered="#{ordenModel.estado == 'CREAR'}"
                                             update="@form"
                                             style="margin-right:10px;" />

                            <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" icon="pi pi-save"
                                             action="#{ordenModel.btnModificarHandler()}"
                                             rendered="#{ordenModel.estado == 'MODIFICAR'}"
                                             update="@form"
                                             style="margin-right:10px;" />

                            <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" icon="pi pi-trash"
                                             action="#{ordenModel.btnEliminarHandler()}"
                                             rendered="#{ordenModel.estado == 'MODIFICAR'}"
                                             process="@this"
                                             immediate="true"
                                             update="@form"
                                             style="margin-right:10px;">
                                <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                           message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>

                            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                             action="#{ordenModel.btnCancelarHandler()}"
                                             process="@this"
                                             immediate="true"
                                             resetValues="true"
                                             update="@form" />
                        </div>
                    </p:tab>

                    <!-- ============ Pestaña 2: productos (solo con la orden ya guardada) ============ -->
                    <p:tab title="#{trad['orden.tab.productos']}" rendered="#{ordenModel.estado == 'MODIFICAR'}">

                        <!-- Agregar producto -->
                        <p:panelGrid columns="3">
                            <p:outputLabel value="#{trad['comun.producto']}" for="cboProducto" />
                            <p:selectOneMenu id="cboProducto" value="#{ordenModel.productoSeleccionado}"
                                             converter="entityConverter"
                                             filter="true" filterMatchMode="contains"
                                             style="width: 300px;">
                                <f:selectItem itemLabel="#{trad['comun.seleccione']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{ordenModel.listaProducto}" var="x"
                                               itemLabel="#{x.nombre}" itemValue="#{x}" />
                            </p:selectOneMenu>
                            <p:commandButton value="#{trad['orden.agregar']}" icon="pi pi-plus"
                                             action="#{ordenModel.btnAgregarProductoHandler()}"
                                             process="@this cboProducto"
                                             update="@form" />
                        </p:panelGrid>

                        <!-- Productos de la orden (solo lectura) -->
                        <p:dataTable id="dtProductos" var="op"
                                     value="#{ordenModel.productosOrden}"
                                     emptyMessage="#{trad['orden.sinProductos']}"
                                     style="margin-top: 10px;">
                            <p:column headerText="#{trad['comun.producto']}">
                                <h:outputText value="#{op.idProducto != null ? op.idProducto.nombre : trad['comun.sinAsignacion']}" />
                            </p:column>
                            <p:column headerText="#{trad['comun.precio']}" style="width: 120px; text-align: right;">
                                <h:outputText value="#{op.precio}">
                                    <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{trad['comun.observaciones']}">
                                <h:outputText value="#{empty op.observaciones ? '—' : op.observaciones}" />
                            </p:column>
                        </p:dataTable>

                        <div style="text-align: right; margin-top: 10px; font-weight: bold;">
                            Total:
                            <h:outputText value="#{ordenModel.total}">
                                <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" />
                            </h:outputText>
                        </div>

                        <!-- Aplicar descuento -->
                        <p:panelGrid columns="3" style="margin-top: 10px;">
                            <p:outputLabel value="#{trad['orden.descuento']}" for="cboDescuento" />
                            <p:selectOneMenu id="cboDescuento" value="#{ordenModel.descuentoSeleccionado}"
                                             converter="entityConverter"
                                             style="width: 300px;">
                                <f:selectItem itemLabel="#{trad['comun.seleccione']}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{ordenModel.listaDescuento}" var="d"
                                               itemLabel="#{ordenModel.etiquetaDescuento(d)}" itemValue="#{d}" />
                            </p:selectOneMenu>
                            <p:commandButton value="#{trad['orden.aplicarDescuento']}" icon="pi pi-percentage"
                                             action="#{ordenModel.btnAplicarDescuentoHandler()}"
                                             process="@this cboDescuento"
                                             update="@form" />
                        </p:panelGrid>

                        <div style="margin-top: 10px;">
                            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                             action="#{ordenModel.btnCancelarHandler()}"
                                             process="@this"
                                             immediate="true"
                                             resetValues="true"
                                             update="@form" />
                        </div>
                    </p:tab>

                </p:tabView>
            </p:outputPanel>

            <!-- Diálogo de confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
