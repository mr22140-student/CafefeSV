<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Órdenes
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmOrden">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <p:dataTable id="dtOrden" var="reg"
                         value="#{ordenModel.registros}"
                         selection="#{ordenModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idOrden}"
                         paginator="true" rows="10"
                         emptyMessage="No hay registros"
                         rendered="#{ordenModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{ordenModel.seleccionarRegistro(ordenModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmOrden" />

                <p:column headerText="ID" style="width: 280px; text-align: center;">
                    <h:outputText value="#{reg.idOrden}" />
                </p:column>

                <p:column headerText="Fecha">
                    <h:outputText value="#{reg.fechaCreacion}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Empleado y rol">
                    <h:outputText value="#{reg.idEmpleadoRol != null ? ordenModel.obtenerTextoEmpleadoRol(reg.idEmpleadoRol) : 'Sin asignación'}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             action="#{ordenModel.btnNuevoHandler()}"
                             rendered="#{ordenModel.estado == 'NINGUNO'}"
                             update=":frmOrden" />

            <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;"
                           rendered="#{ordenModel.estado != 'NINGUNO'}">
                <p:panel header="Mantenimiento Orden">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="ID" for="txtId" />
                        <p:inputText id="txtId" value="#{ordenModel.registro.idOrden}" readonly="true" size="40" />

                        <p:outputLabel value="Fecha" />
                        <h:outputText value="#{ordenModel.registro.fechaCreacion}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                        </h:outputText>

                        <p:outputLabel value="Empleado y rol" for="acEmpleadoRol" />
                        <p:autoComplete id="acEmpleadoRol"
                                        value="#{ordenModel.registro.idEmpleadoRol}"
                                        completeMethod="#{ordenModel.completarEmpleadoRol}"
                                        var="er"
                                        itemLabel="#{ordenModel.obtenerTextoEmpleadoRol(er)}"
                                        itemValue="#{er}"
                                        converter="#{ordenModel.empleadoRolConverter}"
                                        forceSelection="true"
                                        dropdown="true"
                                        queryDelay="300"
                                        scrollHeight="250"
                                        size="40"
                                        placeholder="Escriba nombre, apellido o rol..."
                                        emptyMessage="No se encontraron empleados activos"
                                        required="true"
                                        requiredMessage="Debe seleccionar un empleado y rol válido." />
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <p:commandButton value="#{tradcrud['jsf.crud.crear']}" icon="pi pi-save"
                                     action="#{ordenModel.btnCrearHandler()}"
                                     rendered="#{ordenModel.estado == 'CREAR'}"
                                     update=":frmOrden"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" icon="pi pi-save"
                                     action="#{ordenModel.btnModificarHandler()}"
                                     rendered="#{ordenModel.estado == 'MODIFICAR'}"
                                     update=":frmOrden"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" icon="pi pi-trash"
                                     action="#{ordenModel.btnEliminarHandler()}"
                                     rendered="#{ordenModel.estado == 'MODIFICAR'}"
                                     process="@this"
                                     immediate="true"
                                     update=":frmOrden"
                                     style="margin-right:10px;">
                        <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                   message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                   icon="pi pi-exclamation-triangle" />
                    </p:commandButton>

                    <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                     action="#{ordenModel.btnCancelarHandler()}"
                                     process="@this"
                                     immediate="true"
                                     resetValues="true"
                                     update=":frmOrden" />
                </p:panel>
            </p:outputPanel>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
