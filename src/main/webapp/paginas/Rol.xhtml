<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Rol
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmRol">
            <p:messages id="mensajes" globalOnly="true" showDetail="true" showSummary="true" closable="true" />

            <p:dataTable id="tblRegistros" value="#{rolModel.registros}" var="r"
                         selectionMode="single"
                         selection="#{rolModel.filaSeleccionada}"
                         rowKey="#{r.idRol}">

                <p:ajax event="rowSelect"
                        listener="#{rolModel.seleccionarRegistro(rolModel.filaSeleccionada)}"
                        update=":frmRol" />

                <p:column headerText="ID">
                    <h:outputText value="#{r.idRol}" />
                </p:column>
                <p:column headerText="Nombre">
                    <h:outputText value="#{r.nombre}" />
                </p:column>
                <p:column headerText="Estado">
                    <h:outputText value="#{r.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>
                <p:column headerText="Observaciones">
                    <h:outputText value="#{r.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             style="margin-right:10px;"
                             action="#{rolModel.btnNuevoHandler()}"
                             update=":frmRol" />
            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                             action="#{rolModel.btnCancelarHandler()}"
                             update=":frmRol" />

            <p:spacer height="10" />

            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;" rendered="#{rolModel.estado != 'NINGUNO'}">
                <p:panel
