<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        #{trad['pagina.rol']}
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmRol">
            <p:messages id="mensajes" showDetail="true" showSummary="true" closable="true" />

            <p:dataTable id="tblRegistros" value="#{rolModel.registros}" var="r"
                         selectionMode="single"
                         selection="#{rolModel.filaSeleccionada}"
                         rowKey="#{r.idRol}"
                         rendered="#{rolModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{rolModel.seleccionarRegistro(rolModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmRol" />            

                <p:column headerText="#{trad['comun.nombre']}">
                    <h:outputText value="#{r.nombre}" />
                </p:column>

                <p:column headerText="#{trad['comun.estado']}">
                    <h:outputText value="#{r.activo ? trad['comun.estado.activo'] : trad['comun.estado.inactivo']}" />
                </p:column>

                <p:column headerText="#{trad['comun.observaciones']}">
                    <h:outputText value="#{r.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             style="margin-right:10px;"
                             action="#{rolModel.btnNuevoHandler()}"
                             rendered="#{rolModel.estado == 'NINGUNO'}"
                             update=":frmRol" />

            <p:spacer height="10" />

            <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;" rendered="#{rolModel.estado != 'NINGUNO'}">
                <p:panel header="#{trad['rol.detalle']}">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="ID" for="txtId"/>
                        <p:inputText id="txtId" value="#{rolModel.registro.idRol}" readonly="true" />

                        <p:outputLabel value="#{trad['comun.nombre']}" for="txtNombre"/>
                        <p:inputText id="txtNombre" value="#{rolModel.registro.nombre}" maxlength="155"
                                     required="true" requiredMessage="#{trad['comun.nombreObligatorio']}" />

                        <p:outputLabel value="#{trad['comun.activo']}" for="chkActivo"/>
                        <p:selectBooleanCheckbox id="chkActivo" value="#{rolModel.registro.activo}"/>

                        <p:outputLabel value="Observaciones" for="txtObs"/>
                        <p:inputTextarea id="txtObs" value="#{rolModel.registro.observaciones}" rows="3" cols="40"/>
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <!-- Botones traducidos -->
                    <p:commandButton value="#{tradcrud['jsf.crud.crear']}" 
                                     icon="pi pi-save"
                                     action="#{rolModel.btnCrearHandler()}"
                                     rendered="#{rolModel.estado == 'CREAR'}"
                                     update=":frmRol"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" 
                                     icon="pi pi-save"
                                     action="#{rolModel.btnModificarHandler()}"
                                     rendered="#{rolModel.estado == 'MODIFICAR'}"
                                     update=":frmRol"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" 
                                     icon="pi pi-trash"
                                     action="#{rolModel.btnEliminarHandler()}"
                                     rendered="#{rolModel.estado == 'MODIFICAR'}"
                                     process="@this"
                                     immediate="true"
                                     update=":frmRol"
                                     style="margin-right:10px;" >

                        <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}" 
                                   message="#{tradcrud['jsf.crud.confirmacion.mensaje']}" 
                                   icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                                        <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                     action="#{rolModel.btnCancelarHandler()}"
                                     process="@this"
                                     immediate="true"
                                     resetValues="true"
                                     update=":frmRol" />

                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación traducido -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>
