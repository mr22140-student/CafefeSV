<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Rol
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmRol">
            <p:messages id="mensajes" globalOnly="true" showDetail="true" showSummary="true" closable="true" />

            <!-- Tabla de Registros -->
            <p:dataTable id="tblRegistros" value="#{rolModel.registros}" var="r"
                         selectionMode="single"
                         selection="#{rolModel.registro}"
                         rowKey="#{r.idRol}">

                <p:ajax event="rowSelect"
                        listener="#{rolModel.seleccionarRegistro(rolModel.registro)}"
                        update=":frmRol" />

                <p:column headerText="ID">
                    <h:outputText value="#{r.idRol}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{r.nombre}" />
                </p:column>

                <p:column headerText="Estado">
                    <h:outputText value="#{r.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>

                <p:column headerText="Observaciones">
                    <h:outputText value="#{r.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <!-- Botones globales -->
            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             style="margin-right:10px;"
                             action="#{rolModel.btnNuevoHandler()}"
                             update=":frmRol" />
            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                             action="#{rolModel.btnCancelarHandler()}"
                             update=":frmRol" />

            <p:spacer height="10" />

            <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;" rendered="#{rolModel.estado != 'NINGUNO'}">
                <p:panel header="Mantenimiento Rol">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="ID" for="txtId"/>
                        <p:inputText id="txtId" value="#{rolModel.registro.idRol}" readonly="true" />

                        <p:outputLabel value="Nombre" for="txtNombre"/>
                        <p:inputText id="txtNombre" value="#{rolModel.registro.nombre}" maxlength="155" />

                        <p:outputLabel value="Activo" for="chkActivo"/>
                        <p:selectBooleanCheckbox id="chkActivo" value="#{rolModel.registro.activo}"/>

                        <p:outputLabel value="Observaciones" for="txtObs"/>
                        <p:inputTextarea id="txtObs" value="#{rolModel.registro.observaciones}" rows="3" cols="40"/>
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <p:commandButton value="Crear" icon="pi pi-save"
                                     action="#{rolModel.btnCrearHandler()}"
                                     rendered="#{rolModel.estado == 'CREAR'}"
                                     update=":frmRol" />
                    <p:commandButton value="Modificar" icon="pi pi-save"
                                     action="#{rolModel.btnModificarHandler()}"
                                     rendered="#{rolModel.estado == 'MODIFICAR'}"
                                     update=":frmRol" />
                </p:panel>
            </p:outputPanel>
        </h:form>
    </ui:define>

</ui:composition>
