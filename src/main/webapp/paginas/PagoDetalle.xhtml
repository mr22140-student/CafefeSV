<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
       #{trad['pagina.pagoDetalle']}
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmPagoDetalle">
            <p:growl id="messages" life="5000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- Filtro por pago -->
            <p:panelGrid columns="2" rendered="#{pagoDetalleModel.estado == 'NINGUNO'}">
                <p:outputLabel value="#{trad['pagoDetalle.pago']}" for="cboFiltro" />
                <p:selectOneMenu id="cboFiltro" value="#{pagoDetalleModel.pagoFiltro}"
                                 converter="entityConverter"
                                 filter="true" filterMatchMode="contains"
                                 style="width: 400px;">
                    <f:selectItem itemLabel="#{trad['pagoDetalle.todosPagos']}" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItems value="#{pagoDetalleModel.listaPago}" var="x"
                                   itemLabel="#{pagoDetalleModel.etiquetaPago(x)}" itemValue="#{x}" />
                    <p:ajax event="change" listener="#{pagoDetalleModel.filtrarHandler}"
                            process="@this" update=":frmPagoDetalle" />
                </p:selectOneMenu>
            </p:panelGrid>

            <!-- Resumen del pago filtrado -->
            <p:panelGrid columns="6"
                         rendered="#{pagoDetalleModel.estado == 'NINGUNO' and pagoDetalleModel.pagoFiltro != null}"
                         style="margin-top: 10px;">
                <h:outputText value="#{trad['pago.totalFactura']}:" style="font-weight: bold;" />
                <h:outputText value="#{pagoDetalleModel.totalFiltro}">
                    <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" />
                </h:outputText>

                <h:outputText value="#{trad['pago.pagado']}:" style="font-weight: bold;" />
                <h:outputText value="#{pagoDetalleModel.pagadoFiltro}">
                    <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" />
                </h:outputText>

                <h:outputText value="#{trad['pagoDetalle.falta']}:" style="font-weight: bold;" />
                <h:outputText value="#{pagoDetalleModel.saldoFiltro}"
                              style="color: #{pagoDetalleModel.saldoFiltro > 0 ? '#d32f2f' : '#388e3c'}; font-weight: bold;">
                    <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" />
                </h:outputText>
            </p:panelGrid>

            <p:spacer height="10" />

            <p:dataTable id="dtPagoDetalle" var="reg"
                         value="#{pagoDetalleModel.registros}"
                         selection="#{pagoDetalleModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idPagoDetalle}"
                         paginator="true" rows="10"
                         emptyMessage="#{trad['comun.sinRegistros']}"
                         rendered="#{pagoDetalleModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{pagoDetalleModel.seleccionarRegistro(pagoDetalleModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmPagoDetalle" />

                <p:column headerText="#{trad['pagoDetalle.pago']}" rendered="#{pagoDetalleModel.pagoFiltro == null}">
                    <h:outputText value="#{pagoDetalleModel.etiquetaPago(reg.idPago)}" />
                </p:column>

                <p:column headerText="#{trad['pagoDetalle.tipoPago']}" style="width: 150px;">
                    <h:outputText value="#{reg.tipoPago}" />
                </p:column>

                <p:column headerText="#{trad['pagoDetalle.monto']}" style="width: 120px; text-align: right;">
                    <h:outputText value="#{reg.monto}">
                        <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" />
                    </h:outputText>
                </p:column>

                <p:column headerText="#{trad['pagoDetalle.referencia']}">
                    <h:outputText value="#{empty reg.referenciaExterna ? '—' : reg.referenciaExterna}" />
                </p:column>

                <p:column headerText="Observaciones">
                    <h:outputText value="#{empty reg.observaciones ? '—' : reg.observaciones}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus"
                             action="#{pagoDetalleModel.btnNuevoHandler()}"
                             rendered="#{pagoDetalleModel.estado == 'NINGUNO'}"
                             update=":frmPagoDetalle" />

            <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;"
                           rendered="#{pagoDetalleModel.estado != 'NINGUNO'}">
                <p:panel header="#{trad['pagoDetalle.detalle']}">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="#{trad['pagoDetalle.pago']}" for="cboPago" />
                        <p:selectOneMenu id="cboPago" value="#{pagoDetalleModel.registro.idPago}"
                                         converter="entityConverter"
                                         filter="true" filterMatchMode="contains"
                                         required="true" requiredMessage="#{trad['pagoDetalle.pagoObligatorio']}"
                                         style="width: 400px;">
                            <f:selectItem itemLabel="#{trad['comun.seleccione']}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{pagoDetalleModel.listaPagoPendiente}" var="x"
                                           itemLabel="#{pagoDetalleModel.etiquetaPago(x)}" itemValue="#{x}" />
                            <p:ajax event="change" listener="#{pagoDetalleModel.pagoSeleccionadoHandler}"
                                    process="@this" update="txtMonto" />
                        </p:selectOneMenu>

                        <p:outputLabel value="#{trad['pagoDetalle.tipoPago']}" for="cboTipo" />
                        <p:selectOneMenu id="cboTipo" value="#{pagoDetalleModel.registro.tipoPago}"
                                         required="true" requiredMessage="#{trad['pagoDetalle.tipoObligatorio']}"
                                         style="width: 200px;">
                            <f:selectItems value="#{pagoDetalleModel.tiposPago}" var="t"
                                           itemLabel="#{t}" itemValue="#{t}" />
                        </p:selectOneMenu>

                        <p:outputLabel value="#{trad['pagoDetalle.monto']}" for="txtMonto" />
                        <p:inputNumber id="txtMonto" value="#{pagoDetalleModel.registro.monto}"
                                       symbol="$ " decimalPlaces="2" minValue="0" maxValue="999999.99"
                                       required="true" requiredMessage="#{trad['pagoDetalle.montoObligatorio']}" />

                        <p:outputLabel value="#{trad['pagoDetalle.referencia']}" for="txtReferencia" />
                        <p:inputText id="txtReferencia" value="#{pagoDetalleModel.registro.referenciaExterna}"
                                     size="40"
                                     placeholder="#{trad['pagoDetalle.referenciaAyuda']}" />

                        <p:outputLabel value="Observaciones" for="txtObs" />
                        <p:inputTextarea id="txtObs" value="#{pagoDetalleModel.registro.observaciones}"
                                         rows="3" cols="40" />
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <p:commandButton value="#{tradcrud['jsf.crud.crear']}" icon="pi pi-save"
                                     action="#{pagoDetalleModel.btnCrearHandler()}"
                                     rendered="#{pagoDetalleModel.estado == 'CREAR'}"
                                     update=":frmPagoDetalle"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" icon="pi pi-save"
                                     action="#{pagoDetalleModel.btnModificarHandler()}"
                                     rendered="#{pagoDetalleModel.estado == 'MODIFICAR'}"
                                     update=":frmPagoDetalle"
                                     style="margin-right:10px;" />

                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" icon="pi pi-trash"
                                     action="#{pagoDetalleModel.btnEliminarHandler()}"
                                     rendered="#{pagoDetalleModel.estado == 'MODIFICAR'}"
                                     process="@this"
                                     immediate="true"
                                     update=":frmPagoDetalle"
                                     style="margin-right:10px;">
                        <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                   message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                   icon="pi pi-exclamation-triangle" />
                    </p:commandButton>

                    <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times"
                                     action="#{pagoDetalleModel.btnCancelarHandler()}"
                                     process="@this"
                                     immediate="true"
                                     resetValues="true"
                                     update=":frmPagoDetalle" />
                </p:panel>
            </p:outputPanel>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
