<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        Tipo Descuento
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmTipoDescuento">
            <p:messages id="mensajes" globalOnly="true" showDetail="true" showSummary="true" closable="true" />

            <!-- Tabla de Registros -->
            <p:dataTable id="tblRegistros" value="#{tipoDescuentoModel.registros}" var="r">
                <p:column headerText="ID">
                    <h:outputText value="#{r.idTipoDescuento}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{r.nombre}" />
                </p:column>

                <p:column headerText="Estado">
                    <h:outputText value="#{r.activo ? 'ACTIVO' : 'INACTIVO'}" />
                </p:column>

                <p:column headerText="Observaciones">
                    <h:outputText value="#{r.observaciones}" />
                </p:column>

                <p:column headerText="Acciones">
                    <p:commandButton value="Seleccionar" 
                                     action="#{tipoDescuentoModel.seleccionarRegistro(r)}" 
                                     update=":frmTipoDescuento" />
                </p:column>
            </p:dataTable>

            <p:spacer height="10" />

            <!-- Botones globales -->
            <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" icon="pi pi-plus" 
                             style="margin-right:10px;"
                             action="#{tipoDescuentoModel.btnNuevoHandler()}" 
                             update=":frmTipoDescuento" />
            <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" icon="pi pi-times" 
                             action="#{tipoDescuentoModel.btnCancelarHandler()}" 
                             update=":frmTipoDescuento" />

            <p:spacer height="10" />

            <!-- Formulario de Mantenimiento -->
            <p:outputPanel id="pnlMantenimiento" layout="block" style="margin-top:20px;" rendered="#{tipoDescuentoModel.estado != 'NINGUNO'}">
                <p:panel header="Mantenimiento Tipo Descuento">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="ID" for="txtId"/>
                        <p:inputText id="txtId" value="#{tipoDescuentoModel.registro.idTipoDescuento}" readonly="true" />

                        <p:outputLabel value="Nombre" for="txtNombre"/>
                        <p:inputText id="txtNombre" value="#{tipoDescuentoModel.registro.nombre}" />

                        <p:outputLabel value="Activo" for="chkActivo"/>
                        <p:selectBooleanCheckbox id="chkActivo" value="#{tipoDescuentoModel.registro.activo}"/>

                        <p:outputLabel value="Observaciones" for="txtObs"/>
                        <p:inputTextarea id="txtObs" value="#{tipoDescuentoModel.registro.observaciones}" rows="3" cols="40"/>
                    </p:panelGrid>

                    <p:spacer height="5" />

                    <p:commandButton value="Crear" icon="pi pi-save"
                                     action="#{tipoDescuentoModel.btnCrearHandler()}" 
                                     rendered="#{tipoDescuentoModel.estado == 'CREAR'}" 
                                     update=":frmTipoDescuento" />
                    <p:commandButton value="Modificar" icon="pi pi-save"
                                     action="#{tipoDescuentoModel.btnModificarHandler()}" 
                                     rendered="#{tipoDescuentoModel.estado == 'MODIFICAR'}" 
                                     update=":frmTipoDescuento" />
                </p:panel>
            </p:outputPanel>
        </h:form>
    </ui:define>

</ui:composition>
