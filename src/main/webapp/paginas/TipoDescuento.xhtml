<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
        #{trad['pagina.tipoDescuento']}
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmTipoDescuento">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- Tabla de Registros (Solo visible cuando el estado es NINGUNO) -->
            <p:dataTable id="dtTipoDescuento"
                         var="reg"
                         value="#{tipoDescuentoModel.registros}"
                         selection="#{tipoDescuentoModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idTipoDescuento}"
                         paginator="true" rows="10"
                         emptyMessage="#{trad['comun.sinRegistros']}"
                         rendered="#{tipoDescuentoModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{tipoDescuentoModel.seleccionarRegistro(tipoDescuentoModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmTipoDescuento" />

                <p:column headerText="#{trad['comun.nombre']}">
                    <h:outputText value="#{reg.nombre}" />
                </p:column>
                <p:column headerText="#{trad['tipoDescuento.maximo']} (%)" style="width: 180px; text-align: center;">
                    <h:outputText value="#{reg.descuentoMaximo != null ? reg.descuentoMaximo += ' %' : ''}" />
                </p:column>
                <p:column headerText="#{trad['comun.observaciones']}">
                    <h:outputText value="#{reg.observaciones}" />
                </p:column>
                <p:column headerText="#{trad['comun.estado']}" style="width: 120px; text-align: center;">
                    <h:outputText value="#{reg.activo ? trad['comun.estado.activo'] : trad['comun.estado.inactivo']}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="15" />

            <!-- Botones Principales -->
            <h:panelGroup id="pnlAcciones" layout="block">
                <!-- Botón Nuevo (Solo visible cuando NO se está editando ni creando) -->
                <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" 
                                 icon="pi pi-plus" 
                                 style="margin-right:10px;"
                                 action="#{tipoDescuentoModel.btnNuevoHandler()}"
                                 rendered="#{tipoDescuentoModel.estado == 'NINGUNO'}"
                                 update=":frmTipoDescuento" />

                <!-- Botón Cancelar (Visible siempre o cuando se esté en CREAR / MODIFICAR) -->
                <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" 
                                 icon="pi pi-times" 
                                 action="#{tipoDescuentoModel.btnCancelarHandler()}" 
                                 rendered="#{tipoDescuentoModel.estado != 'NINGUNO'}"
                                 process="@this"
                                 immediate="true"
                                 resetValues="true"
                                 update=":frmTipoDescuento" />
            </h:panelGroup>

            <!-- Formulario de Detalle (Visible únicamente si el estado es CREAR o MODIFICAR) -->
            <p:outputPanel id="pnlFormulario" layout="block" style="margin-top:20px;" rendered="#{tipoDescuentoModel.estado != 'NINGUNO'}">
                <p:panel header="#{trad['tipoDescuento.detalle']}">
                    <p:panelGrid columns="2" 
                                 columnClasses="ui-grid-col-2, ui-grid-col-10" 
                                 layout="grid" 
                                 styleClass="ui-panelgrid-blank">

                        <p:outputLabel for="txtNombre" value="#{trad['comun.nombre']}" style="font-weight: bold;" />
                        <p:inputText id="txtNombre" 
                                     value="#{tipoDescuentoModel.registro.nombre}" 
                                     required="true" 
                                     requiredMessage="#{trad['comun.nombreObligatorio']}" 
                                     style="max-width: 350px; width: 100%;" />

                        <p:outputLabel for="txtDescuentoMaximo" value="#{trad['tipoDescuento.maximo']}:" />
                        <h:panelGroup layout="block" style="width: 90px;">
                            <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
                                <p:inputText id="txtDescuentoMaximo"
                                             value="#{tipoDescuentoModel.registro.descuentoMaximo}"
                                             required="true"
                                             requiredMessage="#{trad['tipoDescuento.maximoObligatorio']}"
                                             validatorMessage="#{trad['tipoDescuento.maximoRango']}"
                                             style="width: 60px; text-align: center;">
                                    <f:validateLongRange minimum="0" maximum="100" />
                                </p:inputText>
                                <h:outputText value="%" />
                            </div>
                            <p:slider for="txtDescuentoMaximo" minValue="0" maxValue="100" step="1"
                                      style="width: 60px;" />
                        </h:panelGroup>

                        <p:outputLabel for="chkActivo" value="#{trad['comun.activo']}:" style="font-weight: bold;" />
                        <h:panelGroup>
                            <p:selectBooleanCheckbox id="chkActivo" value="#{tipoDescuentoModel.registro.activo}" />
                        </h:panelGroup>

                        <p:outputLabel for="txtObservaciones" value="#{trad['comun.observaciones']}:" style="font-weight: bold;" />
                        <p:inputTextarea id="txtObservaciones" 
                                         value="#{tipoDescuentoModel.registro.observaciones}" 
                                         rows="3" 
                                         style="max-width: 350px; width: 100%;" />

                    </p:panelGrid>

                    <p:spacer height="15" />

                    <!-- Botones del Formulario -->
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <p:commandButton value="#{tradcrud['jsf.crud.crear']}" 
                                         icon="pi pi-save" 
                                         action="#{tipoDescuentoModel.btnCrearHandler()}" 
                                         rendered="#{tipoDescuentoModel.estado == 'CREAR'}" 
                                         update=":frmTipoDescuento" />

                        <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" 
                                         icon="pi pi-save" 
                                         action="#{tipoDescuentoModel.btnModificarHandler()}" 
                                         rendered="#{tipoDescuentoModel.estado == 'MODIFICAR'}" 
                                         update=":frmTipoDescuento" />

                        <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" 
                                         icon="pi pi-trash" 
                                         styleClass="ui-button-danger"
                                         action="#{tipoDescuentoModel.btnEliminarHandler()}" 
                                         rendered="#{tipoDescuentoModel.estado == 'MODIFICAR'}" 
                                         process="@this"
                                         immediate="true"
                                         update=":frmTipoDescuento">
                            <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}" 
                                       message="#{tradcrud['jsf.crud.confirmacion.mensaje']}" 
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </div>
                </p:panel>
            </p:outputPanel>

            <!-- Diálogo de Confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
