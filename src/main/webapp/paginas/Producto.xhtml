<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">
       #{trad['pagina.producto']}
    </ui:define>

    <ui:define name="contenido">
        <h:form id="frmProducto">
            <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

            <!-- Tabla de Registros (Solo visible cuando el estado es NINGUNO) -->
            <p:dataTable id="dtProducto"
                         var="reg"
                         value="#{productoModel.registros}"
                         selection="#{productoModel.filaSeleccionada}"
                         selectionMode="single"
                         rowKey="#{reg.idProducto}"
                         paginator="true" rows="10"
                         emptyMessage="#{trad['comun.sinRegistros']}"
                         rendered="#{productoModel.estado == 'NINGUNO'}">

                <p:ajax event="rowSelect"
                        listener="#{productoModel.seleccionarRegistro(productoModel.filaSeleccionada)}"
                        resetValues="true"
                        update=":frmProducto" />

                <p:column headerText="#{trad['comun.nombre']}">
                    <h:outputText value="#{reg.nombre}" />
                </p:column>
                <p:column headerText="#{trad['producto.precioSugerido']}">
                    <h:outputText value="#{reg.precioSugerido}">
                        <f:convertNumber type="currency" currencySymbol="$" locale="en_US" minFractionDigits="2" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{trad['comun.comentarios']}">
                    <h:outputText value="#{reg.comentarios}" />
                </p:column>
                <p:column headerText="#{trad['comun.estado']}" style="width: 100px; text-align: center;">
                    <h:outputText value="#{reg.activo ? trad['comun.estado.activo'] : trad['comun.estado.inactivo']}" />
                </p:column>
            </p:dataTable>

            <p:spacer height="15" />

            <!-- Botones Principales -->
            <h:panelGroup id="pnlAcciones" layout="block">
                <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}"
                                 icon="pi pi-plus"
                                 style="margin-right:10px;"
                                 action="#{productoModel.btnNuevoHandler()}"
                                 rendered="#{productoModel.estado == 'NINGUNO'}"
                                 update=":frmProducto" />

                <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}"
                                 icon="pi pi-times"
                                 action="#{productoModel.btnCancelarHandler()}"
                                 rendered="#{productoModel.estado != 'NINGUNO'}"
                                 process="@this"
                                 immediate="true"
                                 resetValues="true"
                                 update=":frmProducto" />
            </h:panelGroup>

            <!-- Formulario de Detalle (Visible únicamente si el estado es CREAR o MODIFICAR) -->
            <p:outputPanel id="pnlFormulario" layout="block" style="margin-top:20px;" rendered="#{productoModel.estado != 'NINGUNO'}">
                <p:tabView id="tvProducto" activeIndex="#{productoModel.tabActiva}">
                    <p:tab title="#{trad['producto.tab.generalidades']}">
                        <p:panelGrid columns="2"
                                     columnClasses="ui-grid-col-2, ui-grid-col-10"
                                     layout="grid"
                                     styleClass="ui-panelgrid-blank">

                            <p:outputLabel for="txtNombre" value="#{trad['comun.nombre']}" style="font-weight: bold;" />
                            <p:inputText id="txtNombre" value="#{productoModel.registro.nombre}" maxlength="155"
                                         required="true"
                                         requiredMessage="#{trad['comun.nombreObligatorio']}"
                                         style="max-width: 350px; width: 100%;" />

                            <p:outputLabel for="txtPrecioSugerido" value="#{trad['producto.precioSugerido']}:" style="font-weight: bold;" />
                            <p:inputNumber id="txtPrecioSugerido" value="#{productoModel.registro.precioSugerido}"
                                           symbol="$ " decimalPlaces="2" minValue="0" maxValue="999999.99"
                                           required="true"
                                           requiredMessage="#{trad['producto.precioObligatorio']}" />

                            <p:outputLabel for="chkActivo" value="#{trad['comun.activo']}:" style="font-weight: bold;" />
                            <h:panelGroup>
                                <p:selectBooleanCheckbox id="chkActivo" value="#{productoModel.registro.activo}" />
                            </h:panelGroup>

                            <p:outputLabel for="txtComentarios" value="#{trad['comun.comentarios']}:" style="font-weight: bold;" />
                            <p:inputTextarea id="txtComentarios" value="#{productoModel.registro.comentarios}" rows="3"
                                             style="max-width: 350px; width: 100%;" />

                        </p:panelGrid>

                        <p:spacer height="15" />

                        <!-- Botones del Formulario -->
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <p:commandButton value="#{tradcrud['jsf.crud.crear']}"
                                             icon="pi pi-save"
                                             action="#{productoModel.btnCrearHandler()}"
                                             rendered="#{productoModel.estado == 'CREAR'}"
                                             update=":frmProducto" />

                            <p:commandButton value="#{tradcrud['jsf.crud.modificar']}"
                                             icon="pi pi-save"
                                             action="#{productoModel.btnModificarHandler()}"
                                             rendered="#{productoModel.estado == 'MODIFICAR'}"
                                             update=":frmProducto" />

                            <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}"
                                             icon="pi pi-trash"
                                             styleClass="ui-button-danger"
                                             action="#{productoModel.btnEliminarHandler()}"
                                             rendered="#{productoModel.estado == 'MODIFICAR'}"
                                             process="@this"
                                             immediate="true"
                                             update=":frmProducto">
                                <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}"
                                           message="#{tradcrud['jsf.crud.confirmacion.mensaje']}"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>
                        </div>
                    </p:tab>

                    <!-- ===== PESTAÑA 2: TIPOS DE PRODUCTO ===== -->
                    <p:tab title="#{trad['producto.tab.tipos']}" rendered="#{productoModel.estado == 'MODIFICAR'}">
                        <h:panelGroup id="pnlTipos" layout="block">

                            <!-- Tabla de tipos del producto -->
                            <p:dataTable id="dtTipos"
                                         var="t"
                                         value="#{productoModel.tiposDelProducto}"
                                         selection="#{productoModel.tipoFila}"
                                         selectionMode="single"
                                         rowKey="#{t.idProductoTipoProducto}"
                                         paginator="true" rows="5"
                                         emptyMessage="#{trad['producto.sinTipos']}"
                                         rendered="#{productoModel.estadoTipo == 'NINGUNO'}">

                                <p:ajax event="rowSelect"
                                        listener="#{productoModel.seleccionarTipo()}"
                                        process="@this"
                                        update="pnlTipos" />

                                <p:column headerText="#{trad['producto.tipo']}">
                                    <h:outputText value="#{t.idTipoProducto != null ? t.idTipoProducto.nombre : trad['comun.sinAsignacion']}" />
                                </p:column>
                                <p:column headerText="#{trad['producto.fechaCreacion']}">
                                    <h:outputText value="#{t.fechaCreacion}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{trad['comun.observaciones']}">
                                    <h:outputText value="#{t.observaciones}" />
                                </p:column>
                            </p:dataTable>

                            <p:commandButton value="#{trad['producto.nuevoTipo']}"
                                             icon="pi pi-plus"
                                             style="margin-top: 10px;"
                                             action="#{productoModel.nuevoTipo()}"
                                             rendered="#{productoModel.estadoTipo == 'NINGUNO'}"
                                             process="@this"
                                             update="pnlTipos" />

                            <!-- Formulario del tipo -->
                            <h:panelGroup layout="block" rendered="#{productoModel.estadoTipo != 'NINGUNO'}">
                                <p:panelGrid columns="2"
                                             columnClasses="ui-grid-col-2, ui-grid-col-10"
                                             layout="grid"
                                             styleClass="ui-panelgrid-blank">

                                    <p:outputLabel value="#{trad['producto.tipo']}:" style="font-weight: bold;" />
                                    <h:panelGroup layout="block" style="display:flex; gap:8px; align-items:center;">
                                        <p:inputText id="txtTipoProducto"
                                                     value="#{productoModel.registroTipo.idTipoProducto != null ? productoModel.registroTipo.idTipoProducto.nombre : ''}"
                                                     readonly="true"
                                                     placeholder="#{trad['producto.ningunoSeleccionado']}"
                                                     style="max-width: 250px; width: 100%;" />
                                        <p:commandButton value="#{trad['producto.seleccionarTipo']}"
                                                         icon="pi pi-search"
                                                         disabled="#{productoModel.estadoTipo == 'MODIFICAR'}"
                                                         action="#{productoModel.abrirDialogoTipo()}"
                                                         process="@this"
                                                         update=":frmDlgTipo"
                                                         oncomplete="PF('dlgTipo').show()" />
                                    </h:panelGroup>

                                    <p:outputLabel value="#{trad['producto.fechaCreacion']}:" style="font-weight: bold;" />
                                    <h:outputText value="#{productoModel.registroTipo.fechaCreacion}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                    </h:outputText>

                                    <p:outputLabel for="txtObsTipo" value="#{trad['comun.observaciones']}:" style="font-weight: bold;" />
                                    <p:inputTextarea id="txtObsTipo" value="#{productoModel.registroTipo.observaciones}" rows="3"
                                                     style="max-width: 350px; width: 100%;" />
                                </p:panelGrid>

                                <div style="display: flex; gap: 10px; margin-top: 15px;">
                                    <p:commandButton value="#{trad['producto.guardarTipo']}"
                                                     icon="pi pi-save"
                                                     action="#{productoModel.guardarTipo()}"
                                                     process="@this txtObsTipo"
                                                     update="pnlTipos :frmProducto:messages" />

                                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}"
                                                     icon="pi pi-trash"
                                                     styleClass="ui-button-danger"
                                                     action="#{productoModel.eliminarTipo()}"
                                                     rendered="#{productoModel.estadoTipo == 'MODIFICAR'}"
                                                     process="@this"
                                                     update="pnlTipos :frmProducto:messages">
                                        <p:confirm header="#{trad['producto.quitarTipo.titulo']}"
                                                   message="#{trad['producto.quitarTipo.mensaje']}"
                                                   icon="pi pi-exclamation-triangle" />
                                    </p:commandButton>

                                    <p:commandButton value="#{trad['producto.cancelarTipo']}"
                                                     icon="pi pi-times"
                                                     styleClass="ui-button-secondary"
                                                     action="#{productoModel.cancelarTipo()}"
                                                     process="@this"
                                                     update="pnlTipos" />
                                </div>
                            </h:panelGroup>

                        </h:panelGroup>
                    </p:tab>
                    <!-- ===== PESTAÑA 3: CARACTERÍSTICAS ===== -->
                    <p:tab title="#{trad['producto.tab.caracteristicas']}" rendered="#{productoModel.estado == 'MODIFICAR'}">
                        <h:panelGroup id="pnlCaracteristicas" layout="block">

                            <!-- Tabla de características del producto -->
                            <p:dataTable id="dtCaracteristicas"
                                         var="pc"
                                         value="#{productoModel.caracteristicasDelProducto}"
                                         selection="#{productoModel.caracteristicaFila}"
                                         selectionMode="single"
                                         rowKey="#{pc.idProductoCaracteristica}"
                                         paginator="true" rows="5"
                                         emptyMessage="#{trad['producto.sinCaracteristicas']}"
                                         rendered="#{productoModel.estadoCaracteristica == 'NINGUNO'}">

                                <p:ajax event="rowSelect"
                                        listener="#{productoModel.seleccionarCaracteristica()}"
                                        process="@this"
                                        update="pnlCaracteristicas" />

                                <p:column headerText="#{trad['producto.caracteristica']}">
                                    <h:outputText value="#{pc.idCaracteristica != null ? pc.idCaracteristica.nombre : trad['comun.sinAsignacion']}" />
                                </p:column>
                                <p:column headerText="#{trad['producto.tipoCol']}">
                                    <h:outputText value="#{pc.idCaracteristica != null and pc.idCaracteristica.idTipoCaracteristica != null ? pc.idCaracteristica.idTipoCaracteristica.nombre : ''}" />
                                </p:column>
                                <p:column headerText="#{trad['producto.valor']}">
                                    <h:outputText value="#{pc.valor}" />
                                </p:column>
                            </p:dataTable>

                            <p:commandButton value="#{trad['producto.nuevaCaracteristica']}"
                                             icon="pi pi-plus"
                                             style="margin-top: 10px;"
                                             action="#{productoModel.nuevaCaracteristica()}"
                                             rendered="#{productoModel.estadoCaracteristica == 'NINGUNO'}"
                                             process="@this"
                                             update="pnlCaracteristicas" />

                            <!-- Formulario de la característica -->
                            <h:panelGroup layout="block" rendered="#{productoModel.estadoCaracteristica != 'NINGUNO'}">
                                <p:panelGrid columns="2"
                                             columnClasses="ui-grid-col-2, ui-grid-col-10"
                                             layout="grid"
                                             styleClass="ui-panelgrid-blank">

                                    <p:outputLabel value="#{trad['producto.caracteristica']}:" style="font-weight: bold;" />
                                    <h:panelGroup layout="block" style="display:flex; gap:8px; align-items:center;">
                                        <p:inputText id="txtCaracteristica"
                                                     value="#{productoModel.registroCaracteristica.idCaracteristica != null ? productoModel.registroCaracteristica.idCaracteristica.nombre : ''}"
                                                     readonly="true"
                                                     placeholder="#{trad['producto.ningunaSeleccionada']}"
                                                     style="max-width: 250px; width: 100%;" />
                                        <p:commandButton value="#{trad['producto.seleccionarCaracteristica']}"
                                                         icon="pi pi-search"
                                                         disabled="#{productoModel.estadoCaracteristica == 'MODIFICAR'}"
                                                         action="#{productoModel.abrirDialogoCaracteristica()}"
                                                         process="@this"
                                                         update=":frmDlgCaracteristica"
                                                         oncomplete="PF('dlgCaracteristica').show()" />
                                    </h:panelGroup>

                                    <p:outputLabel for="txtValorCaract" value="#{trad['producto.valor']}:" style="font-weight: bold;" />
                                    <h:panelGroup layout="block">
                                        <p:inputText id="txtValorCaract" value="#{productoModel.registroCaracteristica.valor}"
                                                     style="max-width: 350px; width: 100%;" />
                                        <h:outputText id="lblFormatoCaract" value="#{productoModel.formatoValorCaracteristica}"
                                                      style="display:block; margin-top:4px; font-family: monospace; color:#6c757d;" />
                                    </h:panelGroup>
                                </p:panelGrid>

                                <div style="display: flex; gap: 10px; margin-top: 15px;">
                                    <p:commandButton value="#{trad['producto.guardarCaracteristica']}"
                                                     icon="pi pi-save"
                                                     action="#{productoModel.guardarCaracteristica()}"
                                                     process="@this txtValorCaract"
                                                     update="pnlCaracteristicas :frmProducto:messages" />

                                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}"
                                                     icon="pi pi-trash"
                                                     styleClass="ui-button-danger"
                                                     action="#{productoModel.eliminarCaracteristica()}"
                                                     rendered="#{productoModel.estadoCaracteristica == 'MODIFICAR'}"
                                                     process="@this"
                                                     update="pnlCaracteristicas :frmProducto:messages">
                                        <p:confirm header="#{trad['producto.quitarCaracteristica.titulo']}"
                                                   message="#{trad['producto.quitarCaracteristica.mensaje']}"
                                                   icon="pi pi-exclamation-triangle" />
                                    </p:commandButton>

                                    <p:commandButton value="#{trad['producto.cancelarCaracteristica']}"
                                                     icon="pi pi-times"
                                                     styleClass="ui-button-secondary"
                                                     action="#{productoModel.cancelarCaracteristica()}"
                                                     process="@this"
                                                     update="pnlCaracteristicas" />
                                </div>
                            </h:panelGroup>

                        </h:panelGroup>
                    </p:tab>
                    <!-- ===== PESTAÑA 4: DESCUENTOS ===== -->
                    <p:tab title="#{trad['producto.tab.descuentos']}" rendered="#{productoModel.estado == 'MODIFICAR'}">
                        <h:panelGroup id="pnlDescuentos" layout="block">

                            <!-- Tabla de descuentos del producto -->
                            <p:dataTable id="dtDescuentos"
                                         var="dp"
                                         value="#{productoModel.descuentosDelProducto}"
                                         selection="#{productoModel.descuentoFila}"
                                         selectionMode="single"
                                         rowKey="#{dp.idDescuentoProducto}"
                                         paginator="true" rows="5"
                                         emptyMessage="#{trad['producto.sinDescuentos']}"
                                         rendered="#{productoModel.estadoDescuento == 'NINGUNO'}">

                                <p:ajax event="rowSelect"
                                        listener="#{productoModel.seleccionarDescuento()}"
                                        process="@this"
                                        update="pnlDescuentos" />

                                <p:column headerText="#{trad['producto.descuento']}">
                                    <h:outputText value="#{dp.idDescuento != null ? dp.idDescuento.nombre : trad['comun.sinAsignacion']}" />
                                </p:column>
                                <p:column headerText="#{trad['producto.tipoCol']}">
                                    <h:outputText value="#{dp.idDescuento != null and dp.idDescuento.idTipoDescuento != null ? dp.idDescuento.idTipoDescuento.nombre : ''}" />
                                </p:column>
                                <p:column headerText="#{trad['producto.porcentaje']}" style="width: 110px; text-align: center;">
                                    <h:outputText value="#{dp.valor != null ? dp.valor += ' %' : ''}" />
                                </p:column>
                                <p:column headerText="#{trad['producto.inicio']}">
                                    <h:outputText value="#{dp.fechaDesde}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{trad['producto.fin']}">
                                    <h:outputText value="#{dp.fechaHasta}" rendered="#{dp.fechaHasta != null}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                    </h:outputText>
                                    <h:outputText value="#{trad['comun.sinFin']}" rendered="#{dp.fechaHasta == null}" />
                                </p:column>
                            </p:dataTable>

                            <p:commandButton value="#{trad['producto.nuevoDescuento']}"
                                             icon="pi pi-plus"
                                             style="margin-top: 10px;"
                                             action="#{productoModel.nuevoDescuento()}"
                                             rendered="#{productoModel.estadoDescuento == 'NINGUNO'}"
                                             process="@this"
                                             update="pnlDescuentos" />

                            <!-- Formulario del descuento -->
                            <h:panelGroup layout="block" rendered="#{productoModel.estadoDescuento != 'NINGUNO'}">
                                <p:panelGrid columns="2"
                                             columnClasses="ui-grid-col-2, ui-grid-col-10"
                                             layout="grid"
                                             styleClass="ui-panelgrid-blank">

                                    <p:outputLabel value="#{trad['producto.descuento']}:" style="font-weight: bold;" />
                                    <h:panelGroup layout="block" style="display:flex; gap:8px; align-items:center;">
                                        <p:inputText id="txtDescuento"
                                                     value="#{productoModel.registroDescuento.idDescuento != null ? productoModel.registroDescuento.idDescuento.nombre : ''}"
                                                     readonly="true"
                                                     placeholder="#{trad['producto.ningunoSeleccionado']}"
                                                     style="max-width: 250px; width: 100%;" />
                                        <p:commandButton value="#{trad['producto.seleccionarDescuento']}"
                                                         icon="pi pi-search"
                                                         disabled="#{productoModel.estadoDescuento == 'MODIFICAR'}"
                                                         action="#{productoModel.abrirDialogoDescuento()}"
                                                         process="@this"
                                                         update=":frmDlgDescuento"
                                                         oncomplete="PF('dlgDescuento').show()" />
                                    </h:panelGroup>

                                    <p:outputLabel for="txtValorDesc" value="#{trad['producto.porcentaje']}:" style="font-weight: bold;" />
                                    <h:panelGroup layout="block" style="display:flex; gap:10px; align-items:center;">
                                        <p:inputNumber id="txtValorDesc"
                                                       value="#{productoModel.registroDescuento.valor}"
                                                       symbol=" %" symbolPosition="s"
                                                       decimalPlaces="0" minValue="0" maxValue="100"
                                                       inputStyle="width: 100px;" />
                                        <h:outputText id="lblMaximoDesc" value="#{productoModel.textoMaximoDescuento}"
                                                      style="font-style: italic; color:#6c757d;" />
                                    </h:panelGroup>

                                    <p:outputLabel for="dpDesdeDesc" value="#{trad['producto.fechaInicio']}:" style="font-weight: bold;" />
                                    <p:datePicker id="dpDesdeDesc" value="#{productoModel.registroDescuento.fechaDesde}"
                                                  showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true" />

                                    <p:outputLabel for="dpHastaDesc" value="#{trad['producto.fechaFin']}:" style="font-weight: bold;" />
                                    <p:datePicker id="dpHastaDesc" value="#{productoModel.registroDescuento.fechaHasta}"
                                                  showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true" />

                                    <p:outputLabel for="txtObsDesc" value="#{trad['comun.observaciones']}:" style="font-weight: bold;" />
                                    <p:inputTextarea id="txtObsDesc" value="#{productoModel.registroDescuento.observaciones}" rows="3"
                                                     style="max-width: 350px; width: 100%;" />
                                </p:panelGrid>

                                <div style="display: flex; gap: 10px; margin-top: 15px;">
                                    <p:commandButton value="#{trad['producto.guardarDescuento']}"
                                                     icon="pi pi-save"
                                                     action="#{productoModel.guardarDescuento()}"
                                                     process="@this txtValorDesc dpDesdeDesc dpHastaDesc txtObsDesc"
                                                     update="pnlDescuentos :frmProducto:messages" />

                                    <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}"
                                                     icon="pi pi-trash"
                                                     styleClass="ui-button-danger"
                                                     action="#{productoModel.eliminarDescuento()}"
                                                     rendered="#{productoModel.estadoDescuento == 'MODIFICAR'}"
                                                     process="@this"
                                                     update="pnlDescuentos :frmProducto:messages">
                                        <p:confirm header="#{trad['producto.quitarDescuento.titulo']}"
                                                   message="#{trad['producto.quitarDescuento.mensaje']}"
                                                   icon="pi pi-exclamation-triangle" />
                                    </p:commandButton>

                                    <p:commandButton value="#{trad['producto.cancelarDescuento']}"
                                                     icon="pi pi-times"
                                                     styleClass="ui-button-secondary"
                                                     action="#{productoModel.cancelarDescuento()}"
                                                     process="@this"
                                                     update="pnlDescuentos" />
                                </div>
                            </h:panelGroup>

                        </h:panelGroup>
                    </p:tab>
                </p:tabView>
            </p:outputPanel>

            <!-- Diálogo de Confirmación -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{tradcrud['jsf.crud.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{tradcrud['jsf.crud.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>

        <!-- ========== DIÁLOGO: SELECCIONAR TIPO (fuera de frmProducto, con su propio form) ========== -->
        <p:dialog id="dlgTipo" widgetVar="dlgTipo" header="#{trad['producto.dlgTipo']}"
                  modal="true" resizable="false" appendTo="@(body)">
            <h:form id="frmDlgTipo">
                <div style="display:flex; gap:10px; align-items:center; padding: 10px 0;">
                    <p:outputLabel for="cboTipoDialogo" value="#{trad['producto.tipo']}:" />
                    <p:selectOneMenu id="cboTipoDialogo" value="#{productoModel.tipoElegido}"
                                     converter="entityConverter"
                                     filter="true" filterMatchMode="contains"
                                     style="min-width: 220px;">
                        <f:selectItem itemLabel="#{trad['producto.seleccioneTipo']}" itemValue="#{null}" noSelectionOption="true" />
