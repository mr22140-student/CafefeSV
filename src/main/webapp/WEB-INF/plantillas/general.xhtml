<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <!-- Nombre de la pestaña del navegador: "CafefeSV POS - <título de la página>" -->
        <title>#{trad['app.titulo']} - <ui:insert name="leyenda" /></title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    </h:head>

    <h:body>
        <div class="ui-g">
            <!-- Encabezado (Fila 1 = 12 columnas) -->
            <div class="ui-g-12 ui-g-nopad">
                <div class="ui-g-4" style="padding-left: 70px;">
                    <p:graphicImage library="imagenes" name="Cafefe.png" alt="Logo Cafefe" style="width:200px; height:auto;" />
                </div>
                <div class="ui-g-4">
                    <h1>
                        <ui:insert name="leyenda">
                            LEYENDA POR DEFECTO
                        </ui:insert>
                    </h1>
                </div>
                <div class="ui-g-4">
                    <h:form id="frmCambiarIdioma">
                        <p:selectOneMenu value="#{idiomaModel.locale}">
                            <f:selectItem itemLabel="Español" itemValue="es" />
                            <f:selectItem itemLabel="English" itemValue="en" />
                            <f:selectItem itemLabel="中文" itemValue="zh" />
                            <p:ajax event="change" update="@all" />
                        </p:selectOneMenu>
                    </h:form>
                </div>
            </div>

            <!-- Menú y Contenido Principal (Fila 2 = 2 + 10 columnas) -->
            <div class="ui-g-12">

                <!-- Columna izquierda: MENÚ -->
                <div class="ui-g-2">
                    <ui:insert name="menu">
                        <p:panelMenu id="menuPrincipal" style="width: 100%;" stateful="true">
                            <p:submenu label="#{trad['menu.personal']}">
                                <p:menuitem value="#{trad['menu.empleados']}" outcome="/paginas/Empleado" icon="pi pi-user" />
                                <p:menuitem value="#{trad['menu.roles']}" outcome="/paginas/Rol" icon="pi pi-id-card" />
                            </p:submenu>

                            <p:submenu label="#{trad['menu.productos']}">
                                <p:menuitem value="#{trad['menu.tiposProducto']}" outcome="/paginas/TipoProducto" icon="pi pi-tags" />
                                <p:menuitem value="#{trad['menu.productos']}" outcome="/paginas/Producto" icon="pi pi-shopping-cart" />
                                <p:menuitem value="#{trad['menu.tiposCaracteristica']}" outcome="/paginas/TipoCaracteristica" icon="pi pi-sliders-h" />
                                <p:menuitem value="#{trad['menu.caracteristicas']}" outcome="/paginas/Caracteristica" icon="pi pi-list" />
                            </p:submenu>

                            <p:submenu label="#{trad['menu.descuentos']}">
                                <p:menuitem value="#{trad['menu.tiposDescuento']}" outcome="/paginas/TipoDescuento" icon="pi pi-percentage" />
                                <p:menuitem value="#{trad['menu.descuentos']}" outcome="/paginas/Descuento" icon="pi pi-tag" />
                            </p:submenu>

                            <p:submenu label="#{trad['menu.ventas']}">
                                <p:menuitem value="#{trad['menu.ordenes']}" outcome="/paginas/Orden" icon="pi pi-list" />
                                <p:menuitem value="#{trad['menu.productosOrden']}" outcome="/paginas/OrdenProducto" icon="pi pi-plus-circle" />
                            </p:submenu>
                        </p:panelMenu>
                    </ui:insert>
                </div>

                <!-- Columna derecha: CONTENIDO de cada página -->
                <div class="ui-g-10">
                    <ui:insert name="contenido">
                        <!-- El contenido de las páginas irá aquí -->
                    </ui:insert>
                </div>

            </div>

            <!-- Pie de página (Fila 3) -->
            <div class="ui-g-12">
                <p>#{trad['app.derechos']}</p>
            </div>

            <ui:insert name="extras" />
        </div>
    </h:body>
</html>
