<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>CafefeSV POS</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    </h:head>

    <h:body>
        <div class="ui-g">
            <!-- Encabezado (Fila 1 = 12 columnas) -->
            <div class="ui-g-12 ui-g-nopad">
                <div class="ui-g-4" style="padding-left: 70px;">
                    <p:graphicImage library="imagenes" name="Cafefe.png" alt="Logo Cafefe" style="width:200px; height:auto;" />
                </div>
                <div class="ui-g-4">
                    <h1>
                        <ui:insert name="leyenda">
                            LEYENDA POR DEFECTO
                        </ui:insert>
                    </h1>
                </div>
                <div class="ui-g-4">
                    <h:form id="frmCambiarIdioma">
                        <p:selectOneMenu value="#{idiomaModel.locale}">
                            <f:selectItem itemLabel="Español" itemValue="es" />
                            <f:selectItem itemLabel="English" itemValue="en" />
                            <f:selectItem itemLabel="中文" itemValue="zh" />
                            <p:ajax event="change" update="@all" />
                        </p:selectOneMenu>
                    </h:form>
                </div>
            </div>

            <!-- Menú y Contenido Principal (Fila 2 = 2 + 10 columnas) -->
            <div class="ui-g-12">

                <!-- Columna izquierda: MENÚ -->
                <div class="ui-g-2">
                    <ui:insert name="menu">
                        <p:menu toggleable="true" style="width: 100%;">
                            <p:submenu label="Personal">
                                <p:menuitem value="Empleados" outcome="/paginas/Empleado" icon="pi pi-user" />
                                <p:menuitem value="Roles" outcome="/paginas/Rol" icon="pi pi-id-card" />
                                <p:menuitem value="Roles por empleado" outcome="/paginas/EmpleadoRol" icon="pi pi-user-edit" />
                            </p:submenu>

                            <p:submenu label="Productos">
                                <p:menuitem value="Tipos de producto" outcome="/paginas/TipoProducto" />
                                <p:menuitem value="Productos" outcome="/paginas/Producto" />
                                <p:menuitem value="Producto por tipo" outcome="/paginas/ProductoTipoProducto" />
                                <p:menuitem value="Tipos de característica" outcome="/paginas/TipoCaracteristica" />
                                <p:menuitem value="Características" outcome="/paginas/Caracteristica" />
                                <p:menuitem value="Características por producto" outcome="/paginas/ProductoCaracteristica" />
                            </p:submenu>

                            <p:submenu label="Descuentos">
                                <p:menuitem value="Tipos de descuento" outcome="/paginas/TipoDescuento" />
                                <p:menuitem value="Descuentos" outcome="/paginas/Descuento" />
                            </p:submenu>

                            <p:submenu label="Ventas">
                                <p:menuitem value="Cajas" outcome="/paginas/Caja" icon="pi pi-inbox" />
                                <p:menuitem value="Órdenes" outcome="/paginas/Orden" icon="pi pi-list" />
                                <p:menuitem value="Productos por orden" outcome="/paginas/OrdenProducto" icon="pi pi-plus-circle" />
                            </p:submenu>

                            <p:submenu label="Facturación">
                                <p:menuitem value="Facturas" outcome="/paginas/Factura" icon="pi pi-file" />
                                <p:menuitem value="Productos por factura" outcome="/paginas/FacturaOrdenProducto" icon="pi pi-file-edit" />
                                <p:menuitem value="Pagos" outcome="/paginas/Pago" icon="pi pi-credit-card" />
                                <p:menuitem value="Detalle de pagos" outcome="/paginas/PagoDetalle" icon="pi pi-money-bill" />
                            </p:submenu>
                        </p:menu>
                    </ui:insert>
                </div>

                <!-- Columna derecha: CONTENIDO de cada página -->
                <div class="ui-g-10">
                    <ui:insert name="contenido">
                        <!-- El contenido de las páginas irá aquí -->
                    </ui:insert>
                </div>

            </div>

            <!-- Pie de página (Fila 3) -->
            <div class="ui-g-12">
                <p>Todos los derechos reservados © 2026</p>
            </div>

            <ui:insert name="extras" />
        </div>
    </h:body>
</html>
