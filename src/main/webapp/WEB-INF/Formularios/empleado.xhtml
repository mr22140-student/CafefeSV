<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="frmEmpleado">
        <p:growl id="messages" life="4000" showDetail="true" skipDetailIfEqualsSummary="true" />

        <p:dataTable id="dtEmpleado" 
                     var="reg" 
                     value="#{empleadoModel.registros}" 
                     selection="#{empleadoModel.filaSeleccionada}" 
                     selectionMode="single" 
                     rowKey="#{reg.idEmpleado}"
                     paginator="true" rows="2"
                     emptyMessage="No hay registros"
                     rendered="#{empleadoModel.estado == 'NINGUNO'}">

            <p:ajax event="rowSelect" 
                    listener="#{empleadoModel.seleccionarRegistro(empleadoModel.filaSeleccionada)}" 
                    resetValues="true"
                    update="@form" />

            <p:column headerText="Nombre">
                <h:outputText value="#{reg.nombre}" />
            </p:column>

            <p:column headerText="Apellido">
                <h:outputText value="#{reg.apellido}" />
            </p:column>

            <p:column headerText="Estado">
                <h:outputText value="#{reg.activo ? 'ACTIVO' : 'INACTIVO'}" />
            </p:column>

            <p:column headerText="Comentarios">
                <h:outputText value="#{reg.comentarios? '-----' : reg.comentarios}" />
            </p:column>

        </p:dataTable>

        <p:spacer height="10" />

        <p:commandButton value="#{tradcrud['jsf.crud.nuevo']}" 
                         icon="pi pi-plus" 
                         style="margin-right:10px;"
                         action="#{empleadoModel.btnNuevoHandler()}"
                         rendered="#{empleadoModel.estado == 'NINGUNO'}"
                         update="@form" />

        <p:spacer height="10" />

        <!-- Formulario de Mantenimiento -->
        <p:outputPanel id="pnlFormulario" layout="block" style="margin-top:20px;" rendered="#{empleadoModel.estado != 'NINGUNO'}">
            <p:panel header="Detalle del Empleado">

                <p:panelGrid columns="2">

                    <p:outputLabel value="ID" for="txtId" />
                    <p:inputText id="txtId" value="#{empleadoModel.registro.idEmpleado}"
                                 readonly="true" size="40" />

                    <p:outputLabel for="txtNombre" value="Nombre:" />
                    <p:inputText id="txtNombre" 
                                 value="#{empleadoModel.registro.nombre}" 
                                 required="true" 
                                 requiredMessage="El nombre es obligatorio." />

                    <p:outputLabel for="txtApellido" value="Apellido:" />
                    <p:inputText id="txtApellido" 
                                 value="#{empleadoModel.registro.apellido}" 
                                 required="true" 
                                 requiredMessage="El apellido es obligatorio." />

                    <p:outputLabel for="chkActivo" value="Activo:" />
                    <p:selectBooleanCheckbox id="chkActivo" value="#{empleadoModel.registro.activo}" />

                    <p:outputLabel for="txtComentarios" value="Comentarios:" />
                    <p:inputTextarea id="txtComentarios" 
                                     value="#{empleadoModel.registro.comentarios}" 
                                     rows="3" cols="40" />

                </p:panelGrid>

                <p:spacer height="5" />

                <!-- Botones -->
                <div style ="display: flex; gap: 10px;">
                <p:commandButton value="#{tradcrud['jsf.crud.crear']}" 
                                 icon="pi pi-save" 
                                 action="#{empleadoModel.btnCrearHandler()}" 
                                 rendered="#{empleadoModel.estado == 'CREAR'}" 
                                 update="@form" 
                                 />

                <p:commandButton value="#{tradcrud['jsf.crud.modificar']}" 
                                 icon="pi pi-save" 
                                 action="#{empleadoModel.btnModificarHandler()}" 
                                 rendered="#{empleadoModel.estado == 'MODIFICAR'}" 
                                 update="@form" />

                <p:commandButton value="#{tradcrud['jsf.crud.eliminar']}" 
                                 icon="pi pi-trash" 
                                 action="#{empleadoModel.btnEliminarHandler()}" 
                                 rendered="#{empleadoModel.estado == 'MODIFICAR'}" 
                                 process="@this"
                                 immediate="true"
                                 update="@form">
                    <p:confirm header="#{tradcrud['jsf.crud.confirmacion.titulo']}" 
                               message="#{tradcrud['jsf.crud.confirmacion.mensaje']}" 
                               icon="pi pi-exclamation-triangle" />
                </p:commandButton>

                <p:commandButton value="#{tradcrud['jsf.crud.cancelar']}" 
                                 icon="pi pi-times" 
                                 action="#{empleadoModel.btnCancelarHandler()}" 
                                 process="@this"
                                 immediate="true"
                                 resetValues="true"
                                 update="@form" />
                </div>

            </p:panel>
        </p:outputPanel>
    </h:form>

</ui:composition>
